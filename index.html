<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>J.A.R.V.I.S — Voice Interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --cyan:#00d2ff;
  --blue:#0088ff;
  --bg:#020813;
}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:#fff;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ================= J.A.R.V.I.S HUD BACKGROUND ================= */
#hud-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at center, #061225 0%, var(--bg) 100%);
  overflow: hidden;
  transition: filter 0.5s ease;
}

/* Scanline effect */
#hud-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(rgba(0, 210, 255, 0.03) 1px, transparent 1px);
  background-size: 100% 4px;
  pointer-events: none;
  z-index: 2;
}

.hud-svg {
  width: 100vmin;
  height: 100vmin;
  max-width: 900px;
  max-height: 900px;
  filter: drop-shadow(0 0 20px rgba(0, 210, 255, 0.3));
  z-index: 1;
  transition: all 0.5s ease;
}

/* Animation Classes */
.ring-1 { animation: spin 25s linear infinite; transform-origin: 500px 500px; }
.ring-2 { animation: spin-rev 18s linear infinite; transform-origin: 500px 500px; }
.ring-3 { animation: spin 12s linear infinite; transform-origin: 500px 500px; }
.ring-4 { animation: spin-rev 8s linear infinite; transform-origin: 500px 500px; }
.ring-5 { animation: spin 30s linear infinite; transform-origin: 500px 500px; }
.core-pulse { animation: pulseGlow 2.5s ease-in-out infinite; transform-origin: 500px 500px; }
.text-glow { animation: textPulse 3s ease-in-out infinite; }

@keyframes spin { 100% { transform: rotate(360deg); } }
@keyframes spin-rev { 100% { transform: rotate(-360deg); } }
@keyframes pulseGlow {
  0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 10px var(--cyan)); }
  50% { opacity: 1; filter: drop-shadow(0 0 40px var(--cyan)); }
}
@keyframes textPulse {
  0%, 100% { fill: #e0f7ff; text-shadow: 0 0 10px var(--cyan); }
  50% { fill: #ffffff; text-shadow: 0 0 30px var(--cyan), 0 0 50px var(--blue); }
}

/* ================= UI OVERLAY ================= */
#ui-layer {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 40px 20px;
  pointer-events: none; /* Let clicks pass through to visualizer */
}

/* Top Status */
.status-container {
  text-align: center;
  pointer-events: auto;
  margin-top: 20px;
}
.status-text {
  font-family: 'Share Tech Mono', monospace;
  font-size: 14px;
  letter-spacing: 4px;
  color: var(--cyan);
  text-transform: uppercase;
  text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
  transition: all 0.3s ease;
}
.status-text.listening { color: #00ffaa; text-shadow: 0 0 15px #00ffaa; }
.status-text.thinking { color: #ffaa00; text-shadow: 0 0 15px #ffaa00; }
.status-text.speaking { color: #fff; text-shadow: 0 0 20px #fff; }

/* Center Visualizer (Hidden by default, used for audio reactions) */
.audio-visualizer {
  display: flex;
  gap: 6px;
  height: 60px;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.3s ease;
  margin-bottom: 20px;
}
.audio-visualizer.active { opacity: 1; }
.audio-bar {
  width: 6px;
  height: 10px;
  background: var(--cyan);
  border-radius: 3px;
  animation: bounceBar 1.2s ease-in-out infinite;
}
.audio-bar:nth-child(2) { animation-delay: 0.1s; }
.audio-bar:nth-child(3) { animation-delay: 0.2s; }
.audio-bar:nth-child(4) { animation-delay: 0.3s; }
.audio-bar:nth-child(5) { animation-delay: 0.4s; }
.audio-bar:nth-child(6) { animation-delay: 0.15s; }
.audio-bar:nth-child(7) { animation-delay: 0.25s; }

@keyframes bounceBar {
  0%, 100% { height: 10px; background: var(--cyan); }
  50% { height: 50px; background: #fff; box-shadow: 0 0 15px #fff; }
}

/* Subtitles Area */
.subtitles {
  max-width: 800px;
  width: 90%;
  text-align: center;
  min-height: 80px;
  pointer-events: auto;
}
.subtitle-user {
  font-size: 18px;
  color: #8899aa;
  margin-bottom: 12px;
  font-style: italic;
  transition: all 0.3s;
  opacity: 0;
}
.subtitle-jarvis {
  font-size: 22px;
  font-weight: 500;
  color: #fff;
  line-height: 1.5;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
  transition: all 0.3s;
  opacity: 0;
}
.subtitle-user.show, .subtitle-jarvis.show { opacity: 1; }

/* Controls Area */
.controls {
  display: flex;
  gap: 20px;
  pointer-events: auto;
  margin-bottom: 20px;
}
.ctrl-btn {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  border: 2px solid rgba(0, 210, 255, 0.3);
  background: rgba(0, 10, 20, 0.6);
  backdrop-filter: blur(10px);
  color: var(--cyan);
  font-size: 28px;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.3);
  box-shadow: 0 0 20px rgba(0, 210, 255, 0.1);
}
.ctrl-btn:hover {
  background: rgba(0, 210, 255, 0.15);
  border-color: var(--cyan);
  box-shadow: 0 0 30px rgba(0, 210, 255, 0.4);
  transform: scale(1.05);
}
.ctrl-btn.listening {
  border-color: #00ffaa;
  color: #00ffaa;
  box-shadow: 0 0 40px rgba(0, 255, 170, 0.4);
  animation: micPulse 1.5s infinite;
}
.ctrl-btn.muted {
  color: #555;
  border-color: #333;
  box-shadow: none;
}
@keyframes micPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 255, 170, 0.4); }
  50% { transform: scale(1.08); box-shadow: 0 0 50px rgba(0, 255, 170, 0.8); }
}

/* Permissions Modal */
.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(10px);
}
.modal-content {
  background: rgba(10, 20, 35, 0.95);
  border: 1px solid rgba(0, 210, 255, 0.3);
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  max-width: 400px;
}
.modal-content h2 {
  color: var(--cyan);
  margin-bottom: 15px;
  letter-spacing: 2px;
}
.modal-content p {
  color: #aabbcc;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 25px;
}
.modal-content button {
  padding: 12px 30px;
  border-radius: 10px;
  background: var(--cyan);
  border: none;
  color: #000;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}
.modal-content button:hover {
  background: #fff;
  box-shadow: 0 0 20px #fff;
}

.hidden { display: none !important; }
</style>
</head>
<body>

<!-- ================= J.A.R.V.I.S HUD BACKGROUND ================= -->
<div id="hud-bg">
  <svg class="hud-svg" viewBox="0 0 1000 1000">
    <defs>
      <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00d2ff" stop-opacity="1" />
        <stop offset="100%" stop-color="#0088ff" stop-opacity="0.5" />
      </linearGradient>
    </defs>

    <g class="ring-1">
      <circle cx="500" cy="500" r="460" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="10 30" opacity="0.6"/>
      <circle cx="500" cy="500" r="450" fill="none" stroke="url(#cyanGrad)" stroke-width="1" opacity="0.3"/>
    </g>

    <g class="ring-2">
      <circle cx="500" cy="500" r="420" fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-dasharray="150 200" opacity="0.8"/>
      <circle cx="500" cy="500" r="410" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="5 15" opacity="0.5"/>
    </g>

    <g class="ring-3">
      <circle cx="500" cy="500" r="360" fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-dasharray="2 10" opacity="0.7"/>
      <circle cx="500" cy="500" r="340" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-dasharray="80 40" opacity="0.4"/>
    </g>

    <g class="ring-4">
      <circle cx="500" cy="500" r="300" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-dasharray="100 80 20 80" opacity="0.9"/>
      <circle cx="500" cy="500" r="280" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="10 20" opacity="0.6"/>
    </g>

    <g class="ring-5">
      <circle cx="500" cy="500" r="220" fill="none" stroke="url(#cyanGrad)" stroke-width="15" stroke-dasharray="40 10 100 10" opacity="0.8"/>
      <circle cx="500" cy="500" r="200" fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.5"/>
    </g>

    <g class="core-pulse">
      <circle cx="500" cy="500" r="170" fill="none" stroke="#00d2ff" stroke-width="4" opacity="0.8"/>
      <circle cx="500" cy="500" r="160" fill="none" stroke="#00d2ff" stroke-width="1" opacity="0.4"/>
      <circle cx="500" cy="500" r="100" fill="url(#cyanGrad)" opacity="0.1"/>
      <circle cx="500" cy="500" r="50" fill="url(#cyanGrad)" opacity="0.2"/>
    </g>

    <text class="text-glow" x="500" y="515" text-anchor="middle" font-family="'Share Tech Mono', monospace" font-size="42" font-weight="bold" letter-spacing="8">J.A.R.V.I.S</text>
  </svg>
</div>

<!-- ================= UI OVERLAY ================= -->
<div id="ui-layer">
  
  <!-- Top Status -->
  <div class="status-container">
    <div class="status-text" id="statusText">Initializing Systems...</div>
  </div>

  <!-- Audio Visualizer (Appears when speaking/listening) -->
  <div style="display:flex; flex-direction:column; align-items:center; width:100%">
    <div class="audio-visualizer" id="visualizer">
      <div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div>
      <div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div>
      <div class="audio-bar"></div>
    </div>

    <!-- Subtitles -->
    <div class="subtitles">
      <div class="subtitle-user" id="subUser"></div>
      <div class="subtitle-jarvis" id="subJarvis"></div>
    </div>
  </div>

  <!-- Bottom Controls -->
  <div class="controls">
    <button class="ctrl-btn" id="micBtn" title="Click to speak">🎤</button>
    <button class="ctrl-btn" id="muteBtn" title="Mute JARVIS">🔊</button>
  </div>
</div>

<!-- Start Up Modal (Required for Mic Permissions) -->
<div class="modal" id="startModal">
  <div class="modal-content">
    <h2>J.A.R.V.I.S ONLINE</h2>
    <p>To begin, click the button below. Your browser will ask for microphone permission. You can say "Jarvis" to wake me up, or click the Mic button.</p>
    <button id="startBtn">Initialize Voice System</button>
  </div>
</div>

<script>
/* ============ STATE ============ */
let isListening = false;
let isSpeaking = false;
let isMuted = false;
let busy = false;
let recognition = null;
let currentUtterance = null;

/* ============ DOM ELEMENTS ============ */
const statusText = document.getElementById('statusText');
const subUser = document.getElementById('subUser');
const subJarvis = document.getElementById('subJarvis');
const micBtn = document.getElementById('micBtn');
const muteBtn = document.getElementById('muteBtn');
const visualizer = document.getElementById('visualizer');
const startModal = document.getElementById('startModal');

/* ============ INITIALIZATION ============ */
window.addEventListener('load', () => {
  initSpeechRecognition();
  initVoices();
});

document.getElementById('startBtn').addEventListener('click', () => {
  startModal.classList.add('hidden');
  startListening();
  speak("Voice systems online. How can I help you today?");
});

/* ============ SPEECH RECOGNITION (LISTENING) ============ */
function initSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("Your browser does not support Speech Recognition. Please use Google Chrome.");
    return;
  }

  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onstart = () => {
    isListening = true;
    micBtn.classList.add('listening');
    statusText.textContent = "Listening...";
    statusText.className = "status-text listening";
    visualizer.classList.add('active');
  };

  recognition.onresult = (event) => {
    const transcript = event.results[event.results.length - 1][0].transcript.trim();
    if (!transcript) return;

    const lower = transcript.toLowerCase();
    
    // Check if the user said "Jarvis" (Wake Word)
    // Or if they are already actively talking in this session
    if (lower.startsWith('jarvis') || lower.includes('hey jarvis')) {
      const query = transcript.replace(/jarvis/gi, '').replace(/hey/gi, '').trim();
      if (query) {
        handleUserInput(query);
      } else {
        handleUserInput("Hello");
      }
    } else if (busy === false && isListening) {
      // If they didn't say Jarvis but are talking after mic click
      // (We let them talk naturally without the wake word if they manually clicked)
      handleUserInput(transcript);
    }
  };

  recognition.onerror = (event) => {
    if (event.error === 'not-allowed') {
      statusText.textContent = "Microphone Access Denied";
      statusText.className = "status-text";
      isListening = false;
      micBtn.classList.remove('listening');
      visualizer.classList.remove('active');
    }
  };

  recognition.onend = () => {
    isListening = false;
    micBtn.classList.remove('listening');
    
    // Auto restart if not muted and not busy
    if (!isMuted && !isSpeaking && !busy) {
      try { recognition.start(); } catch(e) {}
    } else {
      statusText.textContent = "Standby";
      statusText.className = "status-text";
      visualizer.classList.remove('active');
    }
  };
}

function startListening() {
  if (recognition && !isListening && !isSpeaking && !isMuted) {
    try { recognition.start(); } catch(e) {}
  }
}

function stopListening() {
  if (recognition && isListening) {
    try { recognition.stop(); } catch(e) {}
  }
}

/* ============ TTS (JARVIS SPEAKING) ============ */
let voices = [];
function initVoices() {
  if ('speechSynthesis' in window) {
    voices = speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => {
      voices = speechSynthesis.getVoices();
    };
  }
}

function speak(text) {
  if (isMuted || !('speechSynthesis' in window)) return;

  // 1. Stop listening to prevent feedback loop
  isSpeaking = true;
  stopListening();
  visualizer.classList.add('active');
  statusText.textContent = "Speaking...";
  statusText.className = "status-text speaking";

  // 2. Clean text (remove code blocks, markdown, emojis)
  const cleanText = text.replace(/```[\s\S]*?```/g, 'Code block omitted.').replace(/[*#_`]/g, '').replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}]/gu, '').trim();

  // 3. Setup Utterance
  currentUtterance = new SpeechSynthesisUtterance(cleanText);
  
  // 4. Select the most "Jarvis" sounding voice
  let jarvisVoice = voices.find(v => 
    v.name.includes('Daniel') || 
    v.name.includes('George') || 
    v.name.includes('Google UK English Male') || 
    v.name.includes('Male') ||
    v.lang === 'en-GB'
  );
  if (!jarvisVoice) jarvisVoice = voices[0];

  if (jarvisVoice) currentUtterance.voice = jarvisVoice;
  currentUtterance.rate = 1.0;
  currentUtterance.pitch = 1.0; 
  currentUtterance.volume = 1.0;

  // 5. When TTS finishes
  currentUtterance.onend = () => {
    isSpeaking = false;
    visualizer.classList.remove('active');
    statusText.textContent = "Listening...";
    statusText.className = "status-text listening";
    
    // Resume listening after a 1 second delay to ensure no echo
    setTimeout(() => {
      if (!isMuted) startListening();
    }, 1000);
  };

  currentUtterance.onerror = () => {
    isSpeaking = false;
    visualizer.classList.remove('active');
    if (!isMuted) startListening();
  };

  // 6. Show subtitle and speak
  subJarvis.textContent = text;
  subJarvis.classList.add('show');
  
  window.speechSynthesis.cancel(); // clear any previous speech
  window.speechSynthesis.speak(currentUtterance);
}

/* ============ CORE LOGIC & AI ============ */
async function handleUserInput(text) {
  if (busy) return;
  busy = true;
  
  stopListening();
  visualizer.classList.remove('active');
  
  // Show what user said
  subUser.textContent = `"${text}"`;
  subUser.classList.add('show');
  subJarvis.classList.remove('show');
  subJarvis.textContent = '';

  statusText.textContent = "Processing...";
  statusText.className = "status-text thinking";

  try {
    const reply = await getAIReply(text);
    busy = false;
    speak(reply);
  } catch (error) {
    busy = false;
    speak("I encountered an error connecting to the network. Please try again.");
    statusText.textContent = "Error";
  }
}

async function getAIReply(userText) {
  // Free API integration (Pollinations)
  const messages = [
    { role: 'system', content: 'You are Jarvis, Tony Stark\'s AI assistant. Keep answers concise, highly intelligent, and slightly formal. Limit your response to 2 or 3 short sentences so it can be spoken aloud naturally. Do not use markdown, asterisks, or code blocks.' },
    { role: 'user', content: userText }
  ];

  try {
    const res = await fetch('https://text.pollinations.ai/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, model: 'openai' })
    });

    if (!res.ok) throw new Error('API failed');
    const text = await res.text();
    
    // Parse text (handles both plain text and JSON responses)
    let reply = text.trim();
    if (reply.startsWith('{') || reply.startsWith('[')) {
      try {
        const data = JSON.parse(reply);
        reply = data.choices?.[0]?.message?.content || data.content || reply;
      } catch(_) {}
    }
    
    if (!reply) throw new Error('Empty response');
    return reply;
  } catch (err) {
    throw err;
  }
}

/* ============ CONTROLS ============ */
// Toggle Listening (Click to talk manually)
micBtn.addEventListener('click', () => {
  if (isSpeaking) {
    // Interrupt JARVIS if he's talking
    window.speechSynthesis.cancel();
    isSpeaking = false;
    visualizer.classList.remove('active');
  }
  
  if (isListening) {
    stopListening();
  } else {
    startListening();
  }
});

// Mute Toggle
muteBtn.addEventListener('click', () => {
  isMuted = !isMuted;
  if (isMuted) {
    muteBtn.textContent = '🔇';
    muteBtn.classList.add('muted');
    stopListening();
    window.speechSynthesis.cancel();
    statusText.textContent = "Muted";
    statusText.className = "status-text";
    visualizer.classList.remove('active');
  } else {
    muteBtn.textContent = '🔊';
    muteBtn.classList.remove('muted');
    statusText.textContent = "Listening...";
    statusText.className = "status-text listening";
    startListening();
  }
});
</script>
</body>
</html>
