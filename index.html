<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>JARVIS — AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--border:rgba(255,255,255,.10);--text:#f2f2f2;--muted:#8a8a8a;--muted2:#5a5a5a}
html,body{height:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#000;color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3)}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none !important}

#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.glowLayer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(130px);background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);animation:drift 24s ease-in-out infinite;will-change:transform}
.glow.a{width:520px;height:520px;top:-180px;left:-160px}
.glow.b{width:460px;height:460px;bottom:-200px;right:-160px;animation-delay:-8s;opacity:.7}
.glow.c{width:380px;height:380px;top:42%;left:55%;animation-delay:-14s;opacity:.5}
.glow.d{width:300px;height:300px;bottom:15%;left:10%;animation-delay:-5s;opacity:.35}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-70px) scale(1.15)}66%{transform:translate(-50px,60px) scale(.9)}}
.gridOverlay{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(circle at 50% 40%,#000 10%,transparent 75%);mask-image:radial-gradient(circle at 50% 40%,#000 10%,transparent 75%);animation:gridMove 40s linear infinite}
@keyframes gridMove{from{background-position:0 0,0 0}to{background-position:64px 64px,64px 64px}}

#authScreen{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.authCard{position:relative;width:min(430px,100%);padding:36px 32px 32px;border-radius:24px;background:rgba(10,10,10,.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border);box-shadow:0 50px 120px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.05) inset;animation:popIn .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes popIn{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
.authCard::before{content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.05),rgba(255,255,255,.4));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.brandLogo{font-size:36px;font-weight:800;letter-spacing:10px;text-align:center;background:linear-gradient(135deg,#fff 0%,#888 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:logoPulse 3.4s ease-in-out infinite}
@keyframes logoPulse{0%,100%{filter:drop-shadow(0 0 18px rgba(255,255,255,.25));opacity:.95}50%{filter:drop-shadow(0 0 34px rgba(255,255,255,.6));opacity:1}}
.brandSub{text-align:center;color:var(--muted);font-size:11px;margin:10px 0 26px;letter-spacing:3px;text-transform:uppercase}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.045);padding:5px;border-radius:14px;margin-bottom:22px}
.tab{flex:1;padding:11px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.3s;letter-spacing:.3px}
.tab.active{background:#fff;color:#000;box-shadow:0 6px 22px rgba(255,255,255,.25)}
.tab:not(.active):hover{color:#ccc}
.field{margin-bottom:13px}
.field input{width:100%;padding:14px 16px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.3s}
.field input::placeholder{color:var(--muted2)}
.field input:focus{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.08);box-shadow:0 0 0 4px rgba(255,255,255,.06)}
.btn{font-family:inherit;font-weight:600;cursor:pointer;border:0;border-radius:13px;transition:.28s;font-size:14px}
.btnPrimary{width:100%;padding:14px;color:#000;background:#fff;box-shadow:0 10px 32px rgba(255,255,255,.22);position:relative;overflow:hidden}
.btnPrimary:hover{transform:translateY(-2px);box-shadow:0 16px 42px rgba(255,255,255,.35);background:#f2f2f2}
.btnPrimary:active{transform:translateY(0) scale(.985)}
.errBox{display:none;margin-bottom:14px;padding:11px 14px;border-radius:11px;font-size:13px;line-height:1.5;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);color:#e5e5e5;animation:shake .4s}
.errBox.show{display:block}
.errBox.ok{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4);color:#fff;font-weight:600}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

#app{position:relative;z-index:10;display:flex;height:100vh;width:100%}
.sidebar{width:270px;flex-shrink:0;display:flex;flex-direction:column;background:rgba(6,6,6,.88);backdrop-filter:blur(22px);border-right:1px solid var(--border);transition:transform .35s cubic-bezier(.4,0,.2,1)}
.sideTop{padding:20px 16px 12px}
.sideBrand{font-size:18px;font-weight:800;letter-spacing:6px;background:linear-gradient(135deg,#fff,#777);-webkit-background-clip:text;background-clip:text;color:transparent}
.sideBrandSub{font-size:9px;color:var(--muted2);letter-spacing:2px;margin-top:3px}
.newChatBtn{width:100%;margin-top:16px;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.28s}
.newChatBtn:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.3);transform:translateY(-2px)}
.chatList{flex:1;overflow-y:auto;padding:8px 10px}
.chatItem{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:11px;color:var(--muted);font-size:12.5px;cursor:pointer;transition:.22s;margin-bottom:4px;border:1px solid transparent;white-space:nowrap;overflow:hidden;animation:slideIn .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.chatItem span{flex:1;overflow:hidden;text-overflow:ellipsis}
.chatItem:hover{background:rgba(255,255,255,.06);color:#fff;transform:translateX(2px)}
.chatItem.active{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.22);color:#fff}
.chatItem .del{opacity:0;font-size:16px;padding:0 3px;border-radius:5px;transition:.22s;color:#888}
.chatItem:hover .del{opacity:.7}
.chatItem .del:hover{opacity:1;background:rgba(255,255,255,.15);color:#fff}
.sideBottom{padding:12px;border-top:1px solid var(--border)}
.userChip{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:9px}
.avatar{width:34px;height:34px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,#fff,#888);display:grid;place-items:center;font-weight:800;font-size:13px;color:#000}
.userInfo{overflow:hidden}
.userInfo b{display:block;font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userInfo small{font-size:10.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sideBtn{width:100%;padding:10px;margin-top:6px;border-radius:11px;text-align:left;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:.22s}
.sideBtn:hover{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.2)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:62px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--border);background:rgba(6,6,6,.6);backdrop-filter:blur(16px)}
.menuBtn{display:none;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);font-size:16px;cursor:pointer}
.topTitle{font-weight:700;font-size:15px;letter-spacing:3px;background:linear-gradient(135deg,#fff,#888);-webkit-background-clip:text;background-clip:text;color:transparent}
.topSpacer{flex:1}
.statusPill{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.4px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:#ff4d6d}
.dot.on{background:#fff;animation:pulseDot 1.8s infinite}
.dot.thinking{background:#ffb84d;animation:pulseDot 1s infinite}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.iconBtn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);font-size:15px;cursor:pointer;transition:.24s;display:grid;place-items:center}
.iconBtn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);transform:translateY(-1px)}
.iconBtn.active{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4)}

.messages{flex:1;overflow-y:auto;padding:26px 0 12px;scroll-behavior:smooth}
.msgWrap{max-width:820px;margin:0 auto 18px;padding:0 20px;display:flex;gap:12px;animation:bubbleIn .45s cubic-bezier(.2,.9,.3,1.3);will-change:transform}
@keyframes bubbleIn{0%{opacity:0;transform:translateY(14px) scale(.94)}60%{transform:translateY(-2px) scale(1.01)}100%{opacity:1;transform:none}}
.msgWrap.user{flex-direction:row-reverse}
.msgAvatar{width:32px;height:32px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;font-size:13px;font-weight:800}
.msgAvatar.ai{background:linear-gradient(135deg,#fff,#888);color:#000;animation:avatarGlow 3s ease-in-out infinite}
@keyframes avatarGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.3)}50%{box-shadow:0 0 18px 2px rgba(255,255,255,.4)}}
.msgAvatar.me{background:rgba(255,255,255,.1);border:1px solid var(--border);color:var(--muted)}
.bubble{max-width:min(680px,82%);padding:12px 16px;border-radius:15px;font-size:14px;line-height:1.7;word-wrap:break-word;overflow-wrap:anywhere;transition:.28s}
.msgWrap.ai .bubble{background:rgba(255,255,255,.045);border:1px solid var(--border);border-top-left-radius:5px;color:#e5e5e5}
.msgWrap.ai .bubble:hover{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.07)}
.msgWrap.user .bubble{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-top-right-radius:5px;color:#fff}
.msgWrap.user .bubble:hover{background:rgba(255,255,255,.18)}
.msgWrap.error .bubble{background:rgba(255,80,80,.08);border:1px solid rgba(255,80,80,.3);color:#ffb0b0}
.bubble code.inline{background:rgba(255,255,255,.1);color:#fff;padding:2px 6px;border-radius:5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.bubble pre.code{position:relative;margin:10px 0;padding:13px 15px;border-radius:11px;overflow-x:auto;background:#0a0a0a;border:1px solid rgba(255,255,255,.14);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.65;color:#d0d0d0}
.copyBtn{position:absolute;top:8px;right:8px;padding:4px 10px;border-radius:7px;font-size:10.5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#ccc;cursor:pointer;font-family:inherit;transition:.2s}
.copyBtn:hover{background:rgba(255,255,255,.22);color:#fff}

.typing{display:flex;gap:6px;padding:16px 20px;align-items:center}
.typing span{width:7px;height:7px;border-radius:50%;background:#fff;animation:bounce 1.3s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.16s;opacity:.7}
.typing span:nth-child(3){animation-delay:.32s;opacity:.5}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-7px);opacity:1}}
.typingStatus{margin-left:10px;font-size:11px;color:var(--muted);letter-spacing:.5px}

.welcome{max-width:760px;margin:0 auto;padding:30px 24px;text-align:center;animation:bubbleIn .7s}
.welcome .ring{width:90px;height:90px;margin:0 auto 20px;position:relative}
.welcome .ring .orbit{position:absolute;inset:0;border-radius:50%;border:1.5px dashed rgba(255,255,255,.18);animation:spin 18s linear infinite}
.welcome .ring .orbit:nth-child(2){inset:12px;animation-duration:12s;animation-direction:reverse;border-style:solid;border-color:rgba(255,255,255,.12)}
.welcome .ring .orbit:nth-child(3){inset:24px;animation-duration:8s;border-color:rgba(255,255,255,.25)}
.welcome .ring .core{position:absolute;inset:32px;border-radius:50%;background:radial-gradient(circle,#fff,#888);box-shadow:0 0 30px rgba(255,255,255,.55);animation:corePulse 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes corePulse{0%,100%{transform:scale(1);box-shadow:0 0 20px rgba(255,255,255,.4)}50%{transform:scale(1.1);box-shadow:0 0 40px rgba(255,255,255,.7)}}
.welcome h1{font-size:clamp(26px,4.6vw,40px);font-weight:800;letter-spacing:-.5px;margin-bottom:10px;background:linear-gradient(135deg,#fff 0%,#666 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:logoPulse 3.5s ease-in-out infinite}
.welcome p{color:var(--muted);font-size:13.5px;margin-bottom:8px;line-height:1.6}
.welcome .subline{color:var(--muted2);font-size:11.5px;margin-bottom:24px;letter-spacing:.6px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{padding:11px 17px;border-radius:12px;font-size:12.5px;cursor:pointer;transition:.3s;background:rgba(255,255,255,.045);border:1px solid var(--border);color:#b0b0b0;font-family:inherit;font-weight:500;animation:chipIn .6s backwards}
.chip:nth-child(1){animation-delay:.1s}
.chip:nth-child(2){animation-delay:.2s}
.chip:nth-child(3){animation-delay:.3s}
.chip:nth-child(4){animation-delay:.4s}
@keyframes chipIn{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
.chip:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.35);color:#fff;transform:translateY(-3px);box-shadow:0 10px 28px rgba(255,255,255,.12)}

.composerArea{padding:10px 20px 18px;flex-shrink:0}
.hintBar{max-width:820px;margin:0 auto 8px;height:16px;font-size:11px;color:var(--muted2);letter-spacing:.5px;text-align:center}
.composer{max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:9px;padding:9px 9px 9px 14px;border-radius:19px;background:rgba(14,14,14,.92);backdrop-filter:blur(18px);border:1px solid var(--border);transition:.3s}
.composer:focus-within{border-color:rgba(255,255,255,.45);box-shadow:0 0 0 4px rgba(255,255,255,.06),0 12px 44px rgba(0,0,0,.6)}
.composer textarea{flex:1;resize:none;border:0;outline:none;background:transparent;color:var(--text);font-family:inherit;font-size:14px;line-height:1.6;padding:9px 0;max-height:170px}
.composer textarea::placeholder{color:var(--muted2)}
.sendBtn{width:42px;height:42px;border-radius:13px;flex-shrink:0;border:0;cursor:pointer;background:#fff;color:#000;font-size:16px;display:grid;place-items:center;transition:.28s;box-shadow:0 6px 22px rgba(255,255,255,.22)}
.sendBtn:hover{transform:scale(1.07) rotate(-6deg);box-shadow:0 10px 32px rgba(255,255,255,.4)}
.sendBtn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.micBtn{width:42px;height:42px;border-radius:13px;flex-shrink:0;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);font-size:16px;display:grid;place-items:center;transition:.28s}
.micBtn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3)}
.micBtn.listening{background:rgba(255,255,255,.2);border-color:#fff;color:#fff;animation:micPulse 1.4s infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}70%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}

.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modalCard{width:min(500px,100%);padding:28px;border-radius:22px;background:rgba(14,14,14,.98);border:1px solid var(--border);box-shadow:0 50px 120px rgba(0,0,0,.95);animation:popIn .4s cubic-bezier(.2,.9,.3,1.3);max-height:90vh;overflow-y:auto}
.modalCard h3{font-size:17px;margin-bottom:6px;color:#fff}
.modalCard .sub{font-size:12.5px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.modalCard .freeNote{padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);font-size:11.5px;color:#bbb;line-height:1.6;margin-bottom:16px}
.modalCard label{display:block;font-size:11.5px;color:var(--muted);margin:14px 0 6px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.modalCard input{width:100%;padding:12px 14px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:.22s}
.modalCard input:focus{border-color:rgba(255,255,255,.5);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.modalRow{display:flex;gap:10px;margin-top:22px}
.modalRow .btn{flex:1;padding:12px}
.btnGhost{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text)}
.btnGhost:hover{background:rgba(255,255,255,.13)}
.switchRow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.switchRow span{font-size:12.5px;color:#ccc}
.switch{width:38px;height:22px;border-radius:20px;background:rgba(255,255,255,.12);position:relative;cursor:pointer;transition:.25s;flex-shrink:0}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#888;transition:.25s}
.switch.on{background:#fff}
.switch.on::after{left:19px;background:#000}

.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,90px);padding:12px 22px;border-radius:13px;font-size:13px;font-weight:600;z-index:99;background:rgba(20,20,20,.98);border:1px solid rgba(255,255,255,.35);color:#fff;box-shadow:0 14px 44px rgba(0,0,0,.75);opacity:0;transition:.4s cubic-bezier(.2,.9,.3,1.3)}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (max-width:900px){
  .sidebar{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);box-shadow:0 0 60px rgba(0,0,0,.85)}
  .sidebar.open{transform:translateX(0)}
  .menuBtn{display:grid;place-items:center}
  .bubble{max-width:88%}
  .messages{padding-top:16px}
}
@media (max-width:560px){
  .authCard{padding:28px 22px 24px}
  .brandLogo{font-size:28px;letter-spacing:6px}
  .composerArea{padding:8px 10px 14px}
  .msgWrap{padding:0 12px}
  .topTitle{font-size:13px;letter-spacing:2px}
}
</style>
</head>
<body>

<div class="glowLayer"><div class="glow a"></div><div class="glow b"></div><div class="glow c"></div><div class="glow d"></div></div>
<div class="gridOverlay"></div>
<canvas id="bgCanvas"></canvas>

<div id="authScreen">
  <div class="authCard">
    <div class="brandLogo">JARVIS</div>
    <div class="brandSub">AI Assistant</div>
    <div class="tabs">
      <button class="tab active" data-tab="login" type="button">Login</button>
      <button class="tab" data-tab="signup" type="button">Create Account</button>
    </div>
    <form id="loginForm" autocomplete="off">
      <div class="errBox" id="loginErr"></div>
      <div class="field"><input type="email" id="loginEmail" placeholder="Email address" /></div>
      <div class="field"><input type="password" id="loginPass" placeholder="Password" /></div>
      <button type="submit" class="btn btnPrimary">Login to JARVIS</button>
    </form>
    <form id="signupForm" class="hidden" autocomplete="off">
      <div class="errBox" id="signupErr"></div>
      <div class="field"><input type="text" id="signupName" placeholder="Full name" /></div>
      <div class="field"><input type="email" id="signupEmail" placeholder="Email address" /></div>
      <div class="field"><input type="password" id="signupPass" placeholder="Password (min 6 chars)" /></div>
      <div class="field"><input type="password" id="signupPass2" placeholder="Confirm password" /></div>
      <button type="submit" class="btn btnPrimary">Create My Account</button>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sideTop">

<div class="toast" id="toast"></div>

<script>
/* ============ HELPERS ============ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash(str){let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h)+str.charCodeAt(i);return(h>>>0).toString(36);}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

function fetchWithTimeout(url, options, ms){
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), ms);
  return fetch(url, { ...options, signal: controller.signal })
    .finally(() => clearTimeout(id));
}

function setStatus(text, cls){
  $('#statusText').textContent = text;
  $('#statusDot').className = 'dot ' + (cls || '');
}

/* ============ STORAGE ============ */
const K_USERS='jarvis.users.v8', K_SESSION='jarvis.session.v8';
const db = {
  users:      () => JSON.parse(localStorage.getItem(K_USERS) || '{}'),
  saveUsers:  u  => { try{ localStorage.setItem(K_USERS, JSON.stringify(u)); }catch(_){} },
  session:    () => localStorage.getItem(K_SESSION),
  setSession: e  => e ? localStorage.setItem(K_SESSION, e) : localStorage.removeItem(K_SESSION),
  chats:      e  => { try{ return JSON.parse(localStorage.getItem('jarvis.chats.'+e) || '[]'); }catch(_){ return []; } },
  saveChats:  (e,c) => { try{ localStorage.setItem('jarvis.chats.'+e, JSON.stringify(c)); }catch(_){} },
  settings:   e  => { try{ return JSON.parse(localStorage.getItem('jarvis.settings.'+e) || '{}'); }catch(_){ return {}; } },
  saveSettings:(e,s) => { try{ localStorage.setItem('jarvis.settings.'+e, JSON.stringify(s)); }catch(_){} }
};

let state = { email:null, name:'', chats:[], current:null, voiceOn:true, autoListen:true, settings:{} };

/* ============ PARTICLE BG ============ */
(function particles(){
  const cvs = $('#bgCanvas'); const ctx = cvs.getContext('2d');
  let W,H,parts=[];
  function resize(){
    W = cvs.width  = innerWidth;
    H = cvs.height = innerHeight;
    const n = Math.min(85, Math.floor(W*H/19000));
    parts = Array.from({length:n},()=>({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-.5)*.28, vy:(Math.random()-.5)*.28,
      r:Math.random()*1.6+.5, a:Math.random()*.55+.15
    }));
  }
  function loop(){
    ctx.clearRect(0,0,W,H);
    for(const p of parts){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W) p.vx*=-1;
      if(p.y<0||p.y>H) p.vy*=-1;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='#fff'; ctx.globalAlpha=p.a;
      ctx.shadowBlur=8; ctx.shadowColor='#fff';
      ctx.fill();
    }
    ctx.globalAlpha=1; ctx.shadowBlur=0;
    requestAnimationFrame(loop);
  }
  addEventListener('resize', resize);
  resize(); loop();
})();

/* ============ AUTH ============ */
$$('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    $$('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    const isLogin = tab.dataset.tab === 'login';
    $('#loginForm').classList.toggle('hidden', !isLogin);
    $('#signupForm').classList.toggle('hidden', isLogin);
  });
});

function showErr(box, msg, ok=false){
  box.textContent = msg;
  box.className = 'errBox show' + (ok ? ' ok' : '');
  box.style.animation = 'none'; void box.offsetWidth; box.style.animation = '';
}

$('#signupForm').addEventListener('submit', e => {
  e.preventDefault();
  const box   = $('#signupErr');
  const name  = $('#signupName').value.trim();
  const email = $('#signupEmail').value.trim().toLowerCase();
  const pass  = $('#signupPass').value;
  const pass2 = $('#signupPass2').value;

  if(!name || !email || !pass || !pass2) return showErr(box, '⚠️ Please fill in all fields.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return showErr(box, '⚠️ Please enter a valid email address.');
  if(pass.length < 6) return showErr(box, '⚠️ Password must be at least 6 characters long.');
  if(pass !== pass2) return showErr(box, '⚠️ Passwords do not match.');

  const users = db.users();
  if(users[email]) return showErr(box, '🚫 Account already created with this email. Please login instead.');

  users[email] = { name, pass: hash(pass), created: Date.now() };
  db.saveUsers(users);
  showErr(box, '✅ Account created! Loading JARVIS...', true);
  setTimeout(() => { $('#signupForm').reset(); startSession(email); }, 700);
});

$('#loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const box   = $('#loginErr');
  const email = $('#loginEmail').value.trim().toLowerCase();
  const pass  = $('#loginPass').value;

  if(!email || !pass) return showErr(box, '⚠️ Please enter email and password.');

  const users = db.users();
  if(!users[email]) return showErr(box, '🚫 No account found with this email. Please create an account first.');
  if(users[email].pass !== hash(pass)) return showErr(box, '🚫 Incorrect password. Please try again.');

  showErr(box, '✅ Login successful!', true);
  setTimeout(() => { $('#loginForm').reset(); startSession(email); }, 450);
});

/* ============ SESSION ============ */
function startSession(email){
  const users = db.users();
  if(!users[email]) { db.setSession(null); return; }

  state.email = email;
  state.name  = users[email].name;
  db.setSession(email);

  state.settings = db.settings(email);
  state.voiceOn   = state.settings.voiceOn !== false;
  state.autoListen = state.settings.autoListen !== false;

  state.chats = db.chats(email);
  if(!state.chats.length) state.chats = [makeChat()];
  state.current = state.chats[0].id;

  $('#userName').textContent   = state.name;
  $('#userEmail').textContent  = email;
  $('#userAvatar').textContent = (state.name[0] || 'U').toUpperCase();
  $('#voiceToggle').classList.toggle('active', state.voiceOn);

  $('#authScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  renderChatList(); renderMessages(); $('#input').focus();

  setStatus('Ready', 'on');
  if(state.autoListen) setTimeout(() => startListening(true), 800);
}

$('#logoutBtn').addEventListener('click', () => {
  stopListening();
  try{ speechSynthesis.cancel(); }catch(_){}
  db.setSession(null);
  state.email = null;
  $('#app').classList.add('hidden');
  $('#authScreen').classList.remove('hidden');
  $('#sidebar').classList.remove('open');
});

(function autoLogin(){
  const s = db.session();
  if(s && db.users()[s]) startSession(s);
})();

/* ============ CHAT STATE ============ */
function makeChat(){ return { id:'c'+Date.now()+Math.random().toString(36).slice(2,6), title:'New Chat', messages:[] }; }
const currentChat = () => state.chats.find(c => c.id === state.current);
const persist = () => db.saveChats(state.email, state.chats);

$('#newChatBtn').addEventListener('click', () => {
  const c = makeChat();
  state.chats.unshift(c); state.current = c.id;
  persist(); renderChatList(); renderMessages();
  $('#sidebar').classList.remove('open');
  $('#input').focus();
});

$('#menuBtn').addEventListener('click', () => $('#sidebar').classList.toggle('open'));

function renderChatList(){
  $('#chatList').innerHTML = state.chats.map(c => `
    <div class="chatItem ${c.id === state.current ? 'active' : ''}" data-id="${c.id}">
      <span>💬 ${esc(c.title)}</span>
      <b class="del" data-del="${c.id}">×</b>
    </div>`).join('');

  $$('.chatItem').forEach(el => {
    el.addEventListener('click', ev => {
      if(ev.target.dataset.del){
        state.chats = state.chats.filter(c => c.id !== ev.target.dataset.del);
        if(!state.chats.length) state.chats = [makeChat()];
        if(!state.chats.find(c => c.id === state.current)) state.current = state.chats[0].id;
        persist(); renderChatList(); renderMessages();
        return;
      }
      state.current = el.dataset.id;
      renderChatList(); renderMessages();
      $('#sidebar').classList.remove('open');
    });
  });
}

/* ============ RENDER ============ */
function md(text){
  const blocks = [];
  let t = String(text).replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const i = blocks.length;
    blocks.push(`<pre class="code"><button class="copyBtn" onclick="copyCode(this)">Copy</button><code>${esc(code)}</code></pre>`);
    return `\u0000B${i}\u0000`;
  });
  t = esc(t);
  t = t.replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\n/g, '<br>');
  t = t.replace(/\u0000B(\d+)\u0000/g, (_, i) => blocks[+i]);
  return t;
}
window.copyCode = function(btn){
  const code = btn.parentElement.querySelector('code').textContent;
  if(navigator.clipboard){
    navigator.clipboard.writeText(code).then(() => {
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1400);
    }).catch(() => {});
  }
};

function renderMessages(){
  const box = $('#messages');
  const chat = currentChat();
  if(!chat) return;

  if(!chat.messages.length){
    box.innerHTML = `
      <div class="welcome">
        <div class="ring">
          <div class="orbit"></div><div class="orbit"></div><div class="orbit"></div>
          <div class="core"></div>
        </div>
        <h1>Hi, I'm Jarvis</h1>
        <p>Your personal AI assistant. Ask me anything, or just say "Jarvis" to wake me.</p>
        <div class="subline">ALWAYS LISTENING · READY TO HELP</div>
        <div class="chips">
          <button class="chip" data-prompt="What can you do?">💡 What can you do?</button>
          <button class="chip" data-prompt="Explain quantum computing like I'm 10">🧠 Explain quantum computing</button>
          <button class="chip" data-prompt="Write a JavaScript debounce function">⚡ Write JS debounce</button>
          <button class="chip" data-prompt="Give me 5 startup ideas in 2026">🚀 Startup ideas</button>
        </div>
      </div>`;
    $$('.chip', box).forEach(c => c.addEventListener('click', () => {
      if(busy) return;
      $('#input').value = c.dataset.prompt;
      send();
    }));
    return;
  }

  box.innerHTML = chat.messages.map(m => {
    const isAI = m.role === 'assistant';
    const isErr = m.error === true;
    return `
      <div class="msgWrap ${isAI ? 'ai' : 'user'} ${isErr ? 'error' : ''}">
        <div class="msgAvatar ${isAI ? 'ai' : 'me'}">${isAI ? 'J' : (state.name[0]||'U').toUpperCase()}</div>
        <div><div class="bubble">${md(m.content)}</div></div>
      </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

/* ============ SEND ============ */
const input = $('#input');
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 170) + 'px';
});
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
$('#sendBtn').addEventListener('click', send);

let busy = false;

async function send(){
  if(busy) return;
  const text = input.value.trim();
  if(!text) return;

  const chat = currentChat();
  if(!chat) return;

  busy = true;
  input.value = ''; input.style.height = 'auto';
  $('#sendBtn').disabled = true;
  setStatus('Thinking...', 'thinking');

  chat.messages.push({ role:'user', content:text });
  if(chat.title === 'New Chat') chat.title = text.slice(0, 34) + (text.length > 34 ? '…' : '');
  persist(); renderChatList(); renderMessages();

  const box = $('#messages');
  const typing = document.createElement('div');
  typing.className = 'msgWrap ai';
  typing.innerHTML = `
    <div class="msgAvatar ai">J</div>
    <div class="bubble" style="padding:0;background:transparent;border:0">
      <div class="typing">
        <span></span><span></span><span></span>
        <span class="typingStatus" id="typingStatus">Jarvis is thinking...</span>
      </div>
    </div>`;
  box.appendChild(typing);
  box.scrollTop = box.scrollHeight;

  let reply = '';
  let isError = false;
  try {
    reply = await getReply(chat.messages);
    if(!reply || !reply.trim()){
      reply = "I couldn't generate a response. Please try again.";
      isError = true;
    } else {
      setStatus('Online', 'on');
    }
  } catch(err){
    reply = "⚠️ " + (err.message || 'Something went wrong.');
    isError = true;
    setStatus('Offline', '');
    // restore input so user can retry
    if(!input.value.trim()) input.value = text;
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 170) + 'px';
  }

  typing.remove();

  // Race condition guard: only push if chat still exists
  if(state.chats.find(c => c.id === chat.id)){
    const msg = { role:'assistant', content: reply };
    if(isError) msg.error = true;
    chat.messages.push(msg);
    persist(); renderMessages();
    if(!isError && state.voiceOn) speak(reply);
  }

  busy = false;
  $('#sendBtn').disabled = false;
  input.focus();
}

/* ============ AI ENGINE ============ */
async function getReply(history){
  if(!navigator.onLine) throw new Error('You appear to be offline. Check your internet connection.');

  const s = state.settings;
  if(s.gptKey)      return callOpenAI(history, s.gptKey);
  if(s.claudeKey)   return callClaude(history, s.claudeKey);
  if(s.deepseekKey) return callDeepSeek(history, s.deepseekKey);
  if(s.geminiKey)   return callGemini(history, s.geminiKey);
  return callFree(history);
}

/* free tier — 3 attempts with HTML/JSON detection */
async function callFree(history){
  const trimmedHistory = history.slice(-20);
  const messages = [
    { role: 'system', content: 'You are Jarvis, a friendly and helpful AI assistant. Answer clearly and concisely. Use markdown for code and lists.' },
    ...trimmedHistory.map(m => ({ role: m.role, content: m.content }))
  ];

  const statusEl = () => $('#typingStatus');
  const setMsg = t => { const el = statusEl(); if(el) el.textContent = t; };

  // Attempt 1: POST to base endpoint (plain text reply)
  try {
    setMsg('Connecting...');
    const res = await fetchWithTimeout('https://text.pollinations.ai/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, model: 'openai' })
    }, 30000);

    if(res.ok){
      const text = await res.text();
      const result = parseFreeResponse(text);
      if(result) return result;
    }
  } catch(e){ if(e.name === 'AbortError') console.warn('Attempt 1 timeout'); }

  // Attempt 2: OpenAI-compatible JSON path
  try {
    setMsg('Retrying...');
    const res = await fetchWithTimeout('https://text.pollinations.ai/openai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, model: 'openai' })
    }, 30000);

    if(res.ok){
      const text = await res.text();
      const result = parseFreeResponse(text);
      if(result) return result;
    }
  } catch(e){ if(e.name === 'AbortError') console.warn('Attempt 2 timeout'); }

  // Attempt 3: GET with encoded prompt
  try {
    setMsg('Final attempt...');
    const lastUser = [...history].reverse().find(m => m.role === 'user');
    if(lastUser){
      const prompt = `You are Jarvis, a helpful AI assistant. Answer: ${lastUser.content}`;
      const res = await fetchWithTimeout(
        `https://text.pollinations.ai/${encodeURIComponent(prompt)}`,
        { method:'GET' },
        30000
      );
      if(res.ok){
        const text = await res.text();
        const result = parseFreeResponse(text);
        if(result) return result;
      }
    }
  } catch(e){ if(e.name === 'AbortError') console.warn('Attempt 3 timeout'); }

  throw new Error('AI service is unavailable right now. Please try again in a moment.');
}

function parseFreeResponse(text){
  if(!text) return null;
  const trimmed = text.trim();
  if(!trimmed) return null;

  // Detect HTML error pages
  if(/^<!DOCTYPE|^<html/i.test(trimmed)) return null;

  // Try JSON parse
  if(trimmed.startsWith('{') || trimmed.startsWith('[')){
    try {
      const data = JSON.parse(trimmed);
      const c = data.choices?.[0]?.message?.content
             || data.message?.content
             || data.content
             || (typeof data === 'string' ? data : null);
      if(c && c.trim()) return c.trim();
    } catch(_){}
  }

  // Plain text fallback — must be meaningful
  if(trimmed.length > 2 && !trimmed.startsWith('<')) return trimmed;
  return null;
}

/* key-based providers */
async function callOpenAI(history, key){
  const res = await fetchWithTimeout('https://api.openai.com/v1/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + key },
    body: JSON.stringify({
      model:'gpt-4o-mini',
      messages:[{ role:'system', content:'You are Jarvis, a helpful AI assistant.' }, ...history.slice(-20)]
    })
  }, 45000);
  if(!res.ok) throw new Error('OpenAI error ' + res.status);
  const data = await res.json();
  return data.choices?.[0]?.message?.content || '';
}

async function callClaude(history, key){
  const res = await fetchWithTimeout('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model:'claude-sonnet-4-5',
      max_tokens: 2048,
      system: 'You are Jarvis, a helpful AI assistant.',
      messages: history.slice(-20).map(m => ({ role:m.role, content:m.content }))
    })
  }, 45000);
  if(!res.ok) throw new Error('Claude error ' + res.status);
  const data = await res.json();
  return data.content?.[0]?.text || '';
}

async function callDeepSeek(history, key){
  const res = await fetchWithTimeout('https://api.deepseek.com/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + key },
    body: JSON.stringify({
      model:'deepseek-chat',
      messages:[{ role:'system', content:'You are Jarvis, a helpful AI assistant.' }, ...history.slice(-20)]
    })
  }, 45000);
  if(!res.ok) throw new Error('DeepSeek error ' + res.status);
  const data = await res.json();
  return data.choices?.[0]?.message?.content || '';
}

async function callGemini(history, key){
  const contents = history.slice(-20).map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }]
  }));
  const res = await fetchWithTimeout(
    'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + key,
    {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ contents })
    },
    45000
  );
  if(!res.ok) throw new Error('Gemini error ' + res.status);
  const data = await res.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

/* ============ VOICE ============ */
$('#voiceToggle').addEventListener('click', () => {
  state.voiceOn = !state.voiceOn;
  state.settings.voiceOn = state.voiceOn;
  db.saveSettings(state.email, state.settings);
  $('#voiceToggle').classList.toggle('active', state.voiceOn);
  if(!state.voiceOn){ try{ speechSynthesis.cancel(); }catch(_){} }
  toast(state.voiceOn ? '🔊 Voice on' : '🔇 Voice off');
});

let speaking = false;

function speak(text){
  if(!state.voiceOn || !('speechSynthesis' in window)) return;
  const clean = text.replace(/```[\s\S]*?```/g, 'code block').replace(/[#*`_>•]/g,'').trim().slice(0, 400);
  if(!clean) return;

  speaking = true;
  // CRITICAL: pause mic during TTS to prevent feedback loop
  pauseRecognition();
  try{ speechSynthesis.cancel(); }catch(_){}

  const u = new SpeechSynthesisUtterance(clean);
  u.rate = 1.02; u.pitch = 1.0; u.volume = 1;
  const voices = speechSynthesis.getVoices();
  const pref = voices.find(v => /Google UK English Male|Daniel|Alex/i.test(v.name)) || voices[0];
  if(pref) u.voice = pref;

  // Safety timeout: Chrome sometimes doesn't fire onend
  const estimatedMs = Math.max(2500, clean.length * 75);
  let safetyTimer = setTimeout(() => { finishSpeak(); }, estimatedMs + 5000);

  function finishSpeak(){
    if(!speaking) return;
    speaking = false;
    clearTimeout(safetyTimer);
    setTimeout(resumeRecognition, 600);
  }

  u.onend = finishSpeak;
  u.onerror = finishSpeak;
  try{ speechSynthesis.speak(u); } catch(_){ finishSpeak(); }
}

/* ============ WAKE WORD ============ */
let recognition = null;
let listening = false;
let restartTimer = null;
let lastGreetTime = 0;

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

if(SR){
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onresult = e => {
    let finalText = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      if(e.results[i].isFinal) finalText += e.results[i][0].transcript;
    }
    if(!finalText) return;

    const low = finalText.toLowerCase().trim();
    // match "jarvis" or "hey jarvis" etc. at the start only
    const wakeMatch = low.match(/^(hey\s+|ok(?:ay)?\s+|hi\s+)?jarvis\b[,.\s!]*/i);
    if(wakeMatch){
      const rest = finalText.slice(wakeMatch[0].length).trim();
      if(rest && !busy){
        input.value = rest;
        send();
      } else if(!rest){
        greet();
      }
    }
  };

  recognition.onerror = (e) => {
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      toast('❌ Microphone permission denied');
      listening = false;
      $('#micBtn').classList.remove('listening');
      $('#hintBar').textContent = '';
    }
    // 'no-speech' and 'aborted' are benign
  };

  recognition.onend = () => {
    if(listening){
      clearTimeout(restartTimer);
      restartTimer = setTimeout(() => {
        if(listening){
          try { recognition.start(); } catch(_) {}
        }
      }, 500);
    }
  };
}

function pauseRecognition(){
  if(recognition && listening){
    try{ recognition.abort(); }catch(_){}
  }
}
function resumeRecognition(){
  if(recognition && listening){
    try{ recognition.start(); }catch(_){}
  }
}

function greet(){
  if(busy) return;
  const now = Date.now();
  if(now - lastGreetTime < 3000) return;
  lastGreetTime = now;

  const chat = currentChat();
  if(!chat) return;
  const greeting = "Hi, I'm Jarvis. How can I help you today?";

  // If last message is already this greeting, don't spam
  const last = chat.messages[chat.messages.length - 1];
  if(last && last.role === 'assistant' && last.content === greeting) {
    speak(greeting);
    return;
  }

  chat.messages.push({ role:'assistant', content: greeting });
  if(chat.title === 'New Chat') chat.title = 'Greeting';
  persist(); renderChatList(); renderMessages();
  speak(greeting);
}

function startListening(auto){
  if(!SR){ if(!auto) toast('❌ Voice not supported in this browser'); return; }
  try{
    recognition.start();
    listening = true;
    $('#micBtn').classList.add('listening');
    $('#hintBar').textContent = '🎤 Listening — say "Jarvis" to wake me';
  }catch(_){}
}
function stopListening(){
  listening = false;
  clearTimeout(restartTimer);
  $('#micBtn').classList.remove('listening');
  $('#hintBar').textContent = '';
  try{ recognition && recognition.abort(); }catch(_){}
}
$('#micBtn').addEventListener('click', () => {
  if(listening) stopListening(); else startListening(false);
});

// Pause mic when tab hidden, resume when visible
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    pauseRecognition();
    try{ speechSynthesis.pause(); }catch(_){}
  } else {
    if(listening) resumeRecognition();
    try{ speechSynthesis.resume(); }catch(_){}
  }
});

/* ============ SETTINGS ============ */
$('#settingsBtn').addEventListener('click', () => {
  const s = state.settings;
  $('#setGptKey').value = s.gptKey || '';
  $('#setClaudeKey').value = s.claudeKey || '';
  $('#setDeepseekKey').value = s.deepseekKey || '';
  $('#setGeminiKey').value = s.geminiKey || '';
  $('#autoListenSwitch').classList.toggle('on', s.autoListen !== false);
  $('#settingsModal').classList.remove('hidden');
});
$('#settingsCancel').addEventListener('click', () => $('#settingsModal').classList.add('hidden'));
$('#autoListenSwitch').addEventListener('click', function(){ this.classList.toggle('on'); });

$('#settingsSave').addEventListener('click', () => {
  state.settings.gptKey = $('#setGptKey').value.trim();
  state.settings.claudeKey = $('#setClaudeKey').value.trim();
  state.settings.deepseekKey = $('#setDeepseekKey').value.trim();
  state.settings.geminiKey = $('#setGeminiKey').value.trim();
  state.settings.autoListen = $('#autoListenSwitch').classList.contains('on');
  db.saveSettings(state.email, state.settings);

  state.autoListen = state.settings.autoListen;
  if(state.autoListen && !listening) startListening(true);
  if(!state.autoListen && listening) stopListening();

  $('#settingsModal').classList.add('hidden');
  toast('✅ Settings saved');
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') $('#settingsModal').classList.add('hidden');
  if((e.ctrlKey || e.metaKey) && e.key === 'k'){ e.preventDefault(); input.focus(); }
});

if('speechSynthesis' in window){
  // Preload voices
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => { speechSynthesis.getVoices(); };
}
</script>
