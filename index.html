<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>JARVIS — AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BASE
============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#05060a;
  --glass:rgba(15,17,26,.72);
  --border:rgba(255,255,255,.09);
  --text:#e9edf7;
  --muted:#8b93a7;
  --c1:#7c5cff;
  --c2:#00e5ff;
  --c3:#ff2fb3;
  --grad:linear-gradient(135deg,#7c5cff 0%,#00e5ff 55%,#ff2fb3 100%);
}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:rgba(124,92,255,.5)}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none !important}

/* ============================================================
   ANIMATED BACKGROUND
============================================================ */
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.orbs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(95px);opacity:.55;animation:float 20s ease-in-out infinite;will-change:transform}
.orb.a{width:540px;height:540px;background:#7c5cff;top:-160px;left:-140px}
.orb.b{width:480px;height:480px;background:#00e5ff;bottom:-180px;right:-140px;animation-delay:-7s}
.orb.c{width:400px;height:400px;background:#ff2fb3;top:38%;left:52%;animation-delay:-13s}
.orb.d{width:320px;height:320px;background:#00ffa3;bottom:10%;left:8%;animation-delay:-4s;opacity:.35}
@keyframes float{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(70px,-60px) scale(1.15)}
  66%{transform:translate(-60px,50px) scale(.9)}
}
.gridOverlay{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(circle at 50% 35%,#000 10%,transparent 72%);
  mask-image:radial-gradient(circle at 50% 35%,#000 10%,transparent 72%);
  animation:gridMove 30s linear infinite;
}
@keyframes gridMove{from{background-position:0 0,0 0}to{background-position:64px 64px,64px 64px}}
.scanline{
  position:fixed;left:0;right:0;height:180px;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(0,229,255,.06),transparent);
  animation:scan 9s linear infinite;
}
@keyframes scan{0%{top:-200px}100%{top:110%}}

/* ============================================================
   AUTH SCREEN
============================================================ */
#authScreen{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:20px;overflow:auto;
}
.authCard{
  position:relative;width:min(430px,100%);
  padding:34px 30px 30px;border-radius:24px;
  background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--border);
  box-shadow:0 40px 100px rgba(0,0,0,.7),0 0 0 1px rgba(124,92,255,.12) inset;
  animation:popIn .55s cubic-bezier(.2,.9,.3,1.25);
}
@keyframes popIn{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}
.authCard::before{
  content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;
  background:var(--grad);opacity:.35;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.brandLogo{
  font-size:34px;font-weight:800;letter-spacing:8px;text-align:center;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(124,92,255,.65));
  animation:glowPulse 3.2s ease-in-out infinite;
}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 16px rgba(124,92,255,.5))}50%{filter:drop-shadow(0 0 34px rgba(0,229,255,.75))}}
.brandSub{text-align:center;color:var(--muted);font-size:12.5px;margin:8px 0 24px;letter-spacing:1.6px;text-transform:uppercase}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.045);padding:5px;border-radius:14px;margin-bottom:22px}
.tab{
  flex:1;padding:11px;border:0;border-radius:10px;background:transparent;color:var(--muted);
  font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:.25s;
}
.tab.active{background:var(--grad);color:#fff;box-shadow:0 6px 22px rgba(124,92,255,.45)}
.field{margin-bottom:14px;position:relative}
.field input{
  width:100%;padding:14px 16px;border-radius:13px;
  background:rgba(255,255,255,.045);border:1px solid var(--border);
  color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.25s;
}
.field input::placeholder{color:#5c6478}
.field input:focus{
  border-color:rgba(124,92,255,.75);background:rgba(124,92,255,.08);
  box-shadow:0 0 0 4px rgba(124,92,255,.13);
}
.btn{
  font-family:inherit;font-weight:600;cursor:pointer;border:0;
  border-radius:13px;transition:.25s;font-size:14px;
}
.btnPrimary{
  width:100%;padding:14px;color:#fff;background:var(--grad);background-size:200% 200%;
  animation:gradShift 5s ease infinite;box-shadow:0 10px 30px rgba(124,92,255,.4);position:relative;overflow:hidden;
}
.btnPrimary:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(124,92,255,.55)}
.btnPrimary:active{transform:translateY(0) scale(.99)}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.errBox{
  display:none;margin-bottom:14px;padding:11px 14px;border-radius:11px;font-size:13px;line-height:1.5;
  background:rgba(255,45,85,.13);border:1px solid rgba(255,45,85,.38);color:#ff8fa8;
  animation:shake .38s;
}
.errBox.show{display:block}
.errBox.ok{background:rgba(0,255,163,.11);border-color:rgba(0,255,163,.35);color:#6fffc4}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(4px)}
}

/* ============================================================
   APP LAYOUT
============================================================ */
#app{position:relative;z-index:10;display:flex;height:100vh;width:100%}

/* ---------- Sidebar ---------- */
.sidebar{
  width:272px;flex-shrink:0;display:flex;flex-direction:column;
  background:rgba(9,11,17,.78);backdrop-filter:blur(20px);
  border-right:1px solid var(--border);transition:transform .32s cubic-bezier(.4,0,.2,1);
}
.sideTop{padding:20px 16px 12px}
.sideBrand{
  font-size:19px;font-weight:800;letter-spacing:5px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.newChatBtn{
  width:100%;margin-top:16px;padding:12px;border-radius:12px;
  background:rgba(124,92,255,.14);border:1px solid rgba(124,92,255,.4);
  color:#c8bdff;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:.25s;
}
.newChatBtn:hover{background:rgba(124,92,255,.28);box-shadow:0 0 24px rgba(124,92,255,.35);transform:translateY(-1px)}
.chatList{flex:1;overflow-y:auto;padding:8px 10px}
.chatItem{
  display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:11px;
  color:var(--muted);font-size:13px;cursor:pointer;transition:.2s;margin-bottom:4px;
  border:1px solid transparent;white-space:nowrap;overflow:hidden;
}
.chatItem span{flex:1;overflow:hidden;text-overflow:ellipsis}
.chatItem:hover{background:rgba(255,255,255,.05);color:var(--text)}
.chatItem.active{background:rgba(124,92,255,.17);border-color:rgba(124,92,255,.35);color:#d6cfff}
.chatItem .del{opacity:0;font-size:15px;padding:0 3px;border-radius:5px;transition:.2s;color:#ff6b8a}
.chatItem:hover .del{opacity:.65}
.chatItem .del:hover{opacity:1;background:rgba(255,45,85,.2)}
.sideBottom{padding:12px;border-top:1px solid var(--border)}
.userChip{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;
  background:rgba(255,255,255,.04);margin-bottom:9px;
}
.avatar{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  background:var(--grad);display:grid;place-items:center;
  font-weight:700;font-size:14px;color:#fff;box-shadow:0 4px 16px rgba(124,92,255,.5);
}
.userInfo{overflow:hidden}
.userInfo b{display:block;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userInfo small{font-size:11px;color:var(--muted)}
.sideBtn{
  width:100%;padding:10px;margin-top:6px;border-radius:11px;text-align:left;
  background:transparent;border:1px solid var(--border);color:var(--muted);
  font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;transition:.2s;
}
.sideBtn:hover{background:rgba(255,255,255,.06);color:var(--text);border-color:rgba(255,255,255,.18)}

/* ---------- Main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  height:62px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 18px;
  border-bottom:1px solid var(--border);background:rgba(9,11,17,.55);backdrop-filter:blur(16px);
}
.menuBtn{
  display:none;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.05);
  border:1px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;
}
.topTitle{font-weight:700;font-size:15px;letter-spacing:2.5px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.topSpacer{flex:1}
.statusPill{
  display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:20px;
  font-size:11.5px;font-weight:600;letter-spacing:.5px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);
}
.dot{width:7px;height:7px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 10px #ff4d6d}
.dot.on{background:#00ffa3;box-shadow:0 0 12px #00ffa3;animation:pulseDot 1.8s infinite}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.iconBtn{
  width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.05);
  border:1px solid var(--border);color:var(--text);font-size:15px;cursor:pointer;transition:.22s;
  display:grid;place-items:center;
}
.iconBtn:hover{background:rgba(124,92,255,.22);border-color:rgba(124,92,255,.5)}
.iconBtn.active{background:rgba(0,229,255,.18);border-color:rgba(0,229,255,.55);color:#9cefff;box-shadow:0 0 20px rgba(0,229,255,.3)}

/* ---------- Messages ---------- */
.messages{flex:1;overflow-y:auto;padding:26px 0 12px;scroll-behavior:smooth}
.msgWrap{max-width:820px;margin:0 auto 20px;padding:0 20px;display:flex;gap:13px;animation:msgIn .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes msgIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.msgWrap.user{flex-direction:row-reverse}
.msgAvatar{
  width:34px;height:34px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;
  font-size:14px;font-weight:700;
}
.msgAvatar.ai{background:var(--grad);color:#fff;box-shadow:0 0 20px rgba(124,92,255,.5)}
.msgAvatar.me{background:rgba(255,255,255,.09);border:1px solid var(--border);color:var(--muted)}
.bubble{
  max-width:min(680px,80%);padding:13px 17px;border-radius:16px;
  font-size:14.5px;line-height:1.72;word-wrap:break-word;overflow-wrap:anywhere;
}
.msgWrap.ai .bubble{
  background:rgba(255,255,255,.045);border:1px solid var(--border);
  border-top-left-radius:5px;color:#dfe5f2;
}
.msgWrap.user .bubble{
  background:linear-gradient(135deg,rgba(124,92,255,.28),rgba(0,229,255,.16));
  border:1px solid rgba(124,92,255,.42);border-top-right-radius:5px;color:#f0f2ff;
}
.bubble code.inline{
  background:rgba(0,229,255,.13);color:#7fe6ff;padding:2px 6px;border-radius:5px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.8px;
}
.bubble pre.code{
  position:relative;margin:11px 0;padding:14px 16px;border-radius:12px;overflow-x:auto;
  background:#0a0d15;border:1px solid rgba(124,92,255,.28);
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.8px;line-height:1.65;color:#9fe8ff;
}
.copyBtn{
  position:absolute;top:8px;right:8px;padding:4px 10px;border-radius:7px;font-size:11px;
  background:rgba(124,92,255,.25);border:1px solid rgba(124,92,255,.5);color:#c9beff;
  cursor:pointer;font-family:inherit;
}
.copyBtn:hover{background:rgba(124,92,255,.45)}

/* typing indicator */
.typing{display:flex;gap:5px;padding:17px 20px}
.typing span{
  width:8px;height:8px;border-radius:50%;background:var(--c1);
  animation:bounce 1.3s infinite ease-in-out;
}
.typing span:nth-child(2){background:var(--c2);animation-delay:.16s}
.typing span:nth-child(3){background:var(--c3);animation-delay:.32s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-8px);opacity:1}}

/* welcome */
.welcome{max-width:760px;margin:0 auto;padding:40px 24px;text-align:center;animation:msgIn .6s}
.welcome h1{
  font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.5px;margin-bottom:12px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:glowPulse 3.5s ease-in-out infinite;
}
.welcome p{color:var(--muted);font-size:14.5px;margin-bottom:30px}
.chips{display:flex;flex-wrap:wrap;gap:11px;justify-content:center}
.chip{
  padding:12px 18px;border-radius:13px;font-size:13px;cursor:pointer;transition:.25s;
  background:rgba(255,255,255,.045);border:1px solid var(--border);color:#b9c1d4;
  font-family:inherit;
}
.chip:hover{
  background:rgba(124,92,255,.19);border-color:rgba(124,92,255,.55);color:#ded6ff;
  transform:translateY(-3px);box-shadow:0 10px 28px rgba(124,92,255,.3);
}

/* ---------- Composer ---------- */
.composerArea{padding:10px 20px 18px;flex-shrink:0}
.hintBar{
  max-width:820px;margin:0 auto 8px;height:16px;font-size:11.5px;color:var(--c2);
  letter-spacing:.4px;opacity:.85;text-align:center;
}
.composer{
  max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:9px;
  padding:9px 9px 9px 14px;border-radius:19px;
  background:rgba(16,19,28,.85);backdrop-filter:blur(18px);
  border:1px solid var(--border);transition:.25s;
}
.composer:focus-within{
  border-color:rgba(124,92,255,.6);
  box-shadow:0 0 0 4px rgba(124,92,255,.12),0 12px 44px rgba(0,0,0,.5);
}
.composer textarea{
  flex:1;resize:none;border:0;outline:none;background:transparent;color:var(--text);
  font-family:inherit;font-size:14.5px;line-height:1.6;padding:9px 0;max-height:170px;
}
.composer textarea::placeholder{color:#5c6478}
.sendBtn{
  width:42px;height:42px;border-radius:13px;flex-shrink:0;border:0;cursor:pointer;
  background:var(--grad);color:#fff;font-size:16px;display:grid;place-items:center;
  transition:.25s;box-shadow:0 6px 22px rgba(124,92,255,.45);
}
.sendBtn:hover{transform:scale(1.07) rotate(-8deg)}
.sendBtn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.micBtn{
  width:42px;height:42px;border-radius:13px;flex-shrink:0;cursor:pointer;
  background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);
  font-size:16px;display:grid;place-items:center;transition:.25s;
}
.micBtn:hover{background:rgba(0,229,255,.18);border-color:rgba(0,229,255,.5)}
.micBtn.listening{
  background:rgba(255,45,85,.2);border-color:rgba(255,45,85,.65);color:#ff8fa8;
  animation:micPulse 1.4s infinite;
}
@keyframes micPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,45,85,.5)}
  70%{box-shadow:0 0 0 14px rgba(255,45,85,0)}
}

/* ============================================================
   MODAL
============================================================ */
.modal{
  position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
  background:rgba(3,4,8,.78);backdrop-filter:blur(8px);animation:fadeIn .25s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modalCard{
  width:min(470px,100%);padding:28px;border-radius:22px;
  background:rgba(14,17,25,.96);border:1px solid var(--border);
  box-shadow:0 40px 100px rgba(0,0,0,.75);animation:popIn .4s cubic-bezier(.2,.9,.3,1.25);
}
.modalCard h3{font-size:17px;margin-bottom:6px}
.modalCard .sub{font-size:12.5px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.modalCard label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:600;letter-spacing:.4px}
.modalCard input{
  width:100%;padding:12px 14px;border-radius:11px;background:rgba(255,255,255,.05);
  border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13.5px;outline:none;
}
.modalCard input:focus{border-color:rgba(124,92,255,.7);box-shadow:0 0 0 3px rgba(124,92,255,.13)}
.modalRow{display:flex;gap:10px;margin-top:22px}
.modalRow .btn{flex:1;padding:12px}
.btnGhost{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text)}
.btnGhost:hover{background:rgba(255,255,255,.12)}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,90px);
  padding:12px 22px;border-radius:13px;font-size:13px;font-weight:600;z-index:99;
  background:rgba(20,24,34,.96);border:1px solid rgba(0,229,255,.45);color:#9cefff;
  box-shadow:0 14px 44px rgba(0,0,0,.6);opacity:0;transition:.4s cubic-bezier(.2,.9,.3,1.3);
}
.toast.show{transform:translate(-50%,0);opacity:1}

/* ============================================================
   RESPONSIVE
============================================================ */
@media (max-width:860px){
  .sidebar{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);box-shadow:0 0 60px rgba(0,0,0,.7)}
  .sidebar.open{transform:translateX(0)}
  .menuBtn{display:grid;place-items:center}
  .bubble{max-width:86%}
  .messages{padding-top:16px}
}
@media (max-width:520px){
  .authCard{padding:26px 20px 22px}
  .brandLogo{font-size:27px;letter-spacing:5px}
  .composerArea{padding:8px 10px 14px}
  .msgWrap{padding:0 12px}
}
</style>
</head>
<body>

<!-- ================= ANIMATED BACKGROUND ================= -->
<div class="orbs">
  <div class="orb a"></div><div class="orb b"></div>
  <div class="orb c"></div><div class="orb d"></div>
</div>
<div class="gridOverlay"></div>
<div class="scanline"></div>
<canvas id="bgCanvas"></canvas>

<!-- ================= AUTH SCREEN ================= -->
<div id="authScreen">
  <div class="authCard">
    <div class="brandLogo">JARVIS</div>
    <div class="brandSub">Your Personal AI Assistant</div>

    <div class="tabs">
      <button class="tab active" data-tab="login">Login</button>
      <button class="tab" data-tab="signup">Create Account</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" autocomplete="off">
      <div class="errBox" id="loginErr"></div>
      <div class="field"><input type="email" id="loginEmail" placeholder="Email address" /></div>
      <div class="field"><input type="password" id="loginPass" placeholder="Password" /></div>
      <button type="submit" class="btn btnPrimary">Login to JARVIS</button>
    </form>

    <!-- SIGNUP -->
    <form id="signupForm" class="hidden" autocomplete="off">
      <div class="errBox" id="signupErr"></div>
      <div class="field"><input type="text" id="signupName" placeholder="Full name" /></div>
      <div class="field"><input type="email" id="signupEmail" placeholder="Email address" /></div>
      <div class="field"><input type="password" id="signupPass" placeholder="Password (min 6 characters)" /></div>
      <div class="field"><input type="password" id="signupPass2" placeholder="Confirm password" /></div>
      <button type="submit" class="btn btnPrimary">Create My Account</button>
    </form>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sideTop">
      <div class="sideBrand">JARVIS</div>
      <button class="newChatBtn" id="newChatBtn">＋ New Conversation</button>
    </div>
    <div class="chatList" id="chatList"></div>
    <div class="sideBottom">
      <div class="userChip">
        <div class="avatar" id="userAvatar">U</div>
        <div class="userInfo">
          <b id="userName">User</b>
          <small id="userEmail">user@mail.com</small>
        </div>
      </div>
      <button class="sideBtn" id="settingsBtn">⚙ &nbsp;Settings &amp; API</button>

<script>
/* ============================================================
   0. HELPERS
============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function hash(str){
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h) + str.charCodeAt(i);
  return (h >>> 0).toString(36);
}

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ============================================================
   1. STORAGE LAYER
============================================================ */
const K_USERS   = 'jarvis.users.v1';
const K_SESSION = 'jarvis.session.v1';

const db = {
  users:      () => JSON.parse(localStorage.getItem(K_USERS) || '{}'),
  saveUsers:  u  => localStorage.setItem(K_USERS, JSON.stringify(u)),
  session:    () => localStorage.getItem(K_SESSION),
  setSession: e  => e ? localStorage.setItem(K_SESSION, e) : localStorage.removeItem(K_SESSION),
  chats:      e  => JSON.parse(localStorage.getItem('jarvis.chats.' + e) || '[]'),
  saveChats:  (e, c) => localStorage.setItem('jarvis.chats.' + e, JSON.stringify(c))
};

let state = { email: null, name: '', chats: [], current: null };

/* ============================================================
   2. ANIMATED PARTICLE BACKGROUND
============================================================ */
(function particles(){
  const cvs = $('#bgCanvas');
  const ctx = cvs.getContext('2d');
  let W, H, parts = [];
  const COLORS = ['#7c5cff', '#00e5ff', '#ff2fb3', '#00ffa3'];

  function resize(){
    W = cvs.width  = innerWidth;
    H = cvs.height = innerHeight;
    const count = Math.min(90, Math.floor(W * H / 18000));
    parts = Array.from({ length: count }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - .5) * .32,
      vy: (Math.random() - .5) * .32,
      r: Math.random() * 1.9 + .6,
      c: COLORS[(Math.random() * COLORS.length) | 0],
      a: Math.random() * .55 + .18
    }));
  }

  function loop(){
    ctx.clearRect(0, 0, W, H);
    for (const p of parts){
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.c;
      ctx.globalAlpha = p.a;
      ctx.shadowBlur = 12;
      ctx.shadowColor = p.c;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    requestAnimationFrame(loop);
  }

  addEventListener('resize', resize);
  resize();
  loop();
})();

/* ============================================================
   3. AUTHENTICATION
============================================================ */
// tab switching
$$('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    $$('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const isLogin = tab.dataset.tab === 'login';
    $('#loginForm').classList.toggle('hidden', !isLogin);
    $('#signupForm').classList.toggle('hidden', isLogin);
  });
});

function showErr(box, msg, ok = false){
  box.textContent = msg;
  box.className = 'errBox show' + (ok ? ' ok' : '');
  box.style.animation = 'none';
  void box.offsetWidth;
  box.style.animation = '';
}

/* -------- SIGN UP -------- */
$('#signupForm').addEventListener('submit', e => {
  e.preventDefault();
  const box   = $('#signupErr');
  const name  = $('#signupName').value.trim();
  const email = $('#signupEmail').value.trim().toLowerCase();
  const pass  = $('#signupPass').value;
  const pass2 = $('#signupPass2').value;

  if (!name || !email || !pass || !pass2) return showErr(box, '⚠️ Please fill in all fields.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return showErr(box, '⚠️ Please enter a valid email address.');
  if (pass.length < 6) return showErr(box, '⚠️ Password must be at least 6 characters long.');
  if (pass !== pass2) return showErr(box, '⚠️ Passwords do not match.');

  const users = db.users();
  // >>> the requested "account already created" error <<<
  if (users[email]) {
    return showErr(box, '🚫 Account already created with this email. Please login instead.');
  }

  users[email] = { name, pass: hash(pass), created: Date.now() };
  db.saveUsers(users);
  showErr(box, '✅ Account created successfully! Loading JARVIS...', true);

  setTimeout(() => {
    $('#signupForm').reset();
    startSession(email);
  }, 750);
});

/* -------- LOGIN -------- */
$('#loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const box   = $('#loginErr');
  const email = $('#loginEmail').value.trim().toLowerCase();
  const pass  = $('#loginPass').value;

  if (!email || !pass) return showErr(box, '⚠️ Please enter your email and password.');

  const users = db.users();
  if (!users[email]) return showErr(box, '🚫 No account found with this email. Please create an account first.');
  if (users[email].pass !== hash(pass)) return showErr(box, '🚫 Incorrect password. Please try again.');

  showErr(box, '✅ Login successful!', true);
  setTimeout(() => { $('#loginForm').reset(); startSession(email); }, 500);
});

/* ============================================================
   4. SESSION / APP BOOT
============================================================ */
function startSession(email){
  const users = db.users();
  if (!users[email]) { db.setSession(null); return; }

  state.email = email;
  state.name  = users[email].name;
  db.setSession(email);

  state.chats = db.chats(email);
  if (!state.chats.length) state.chats = [makeChat()];
  state.current = state.chats[0].id;

  $('#userName').textContent  = state.name;
  $('#userEmail').textContent = email;
  $('#userAvatar').textContent = (state.name[0] || 'U').toUpperCase();

  $('#authScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');

  renderChatList();
  renderMessages();
  updateStatus();
}

$('#logoutBtn').addEventListener('click', () => {
  stopListening();
  speechSynthesis.cancel();
  db.setSession(null);
  state = { email: null, name: '', chats: [], current: null };
  $('#app').classList.add('hidden');
  $('#authScreen').classList.remove('hidden');
  $('#sidebar').classList.remove('open');
});

/* auto-login if session exists */
(function autoLogin(){
  const s = db.session();
  if (s && db.users()[s]) startSession(s);
})();

/* ============================================================
   5. CHAT STATE MANAGEMENT
============================================================ */
function makeChat(){
  return {
    id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6),
    title: 'New Chat',
    messages: []
  };
}
const currentChat = () => state.chats.find(c => c.id === state.current);
const persist = () => db.saveChats(state.email, state.chats);

$('#newChatBtn').addEventListener('click', () => {
  const c = makeChat();
  state.chats.unshift(c);
  state.current = c.id;
  persist(); renderChatList(); renderMessages();
  $('#sidebar').classList.remove('open');
  $('#input').focus();
});

function renderChatList(){
  const list = $('#chatList');
  list.innerHTML = state.chats.map(c => `
    <div class="chatItem ${c.id === state.current ? 'active' : ''}" data-id="${c.id}">
      <span>💬 ${esc(c.title)}</span>
      <b class="del" data-del="${c.id}">×</b>
    </div>`).join('');

  $$('.chatItem', list).forEach(el => {
    el.addEventListener('click', ev => {
      if (ev.target.dataset.del) {
        state.chats = state.chats.filter(c => c.id !== ev.target.dataset.del);
        if (!state.chats.length) state.chats = [makeChat()];
        if (!state.chats.find(c => c.id === state.current)) state.current = state.chats[0].id;
        persist(); renderChatList(); renderMessages();
        return;
      }
      state.current = el.dataset.id;
      renderChatList(); renderMessages();
      $('#sidebar').classList.remove('open');
    });
  });
}

/* ============================================================
   6. MESSAGE RENDERING
============================================================ */
function md(text){
  const blocks = [];
  let t = String(text).replace(/
