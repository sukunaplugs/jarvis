<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S - Voice AI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --cyan: #00f3ff;
            --dark-cyan: #0066aa;
            --bg-dark: #05080f;
            --bg-panel: rgba(15, 23, 36, 0.75);
            --bg-sidebar: rgba(8, 12, 20, 0.95);
            --glass-border: rgba(0, 243, 255, 0.2);
            --accent: #00ffcc;
            --speaking-color: #ff00ea;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --code-bg: #1e1e1e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 60% 40%, rgba(0, 243, 255, 0.05) 0%, transparent 60%),
                        radial-gradient(circle at 40% 60%, rgba(255, 0, 234, 0.03) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
            animation: bg-pulse 10s infinite alternate;
        }

        @keyframes bg-pulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            z-index: 100;
            backdrop-filter: blur(20px);
        }

        .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .new-chat-btn {
            width: 100%; padding: 12px; background: transparent;
            border: 1px solid var(--cyan); color: var(--cyan);
            border-radius: 8px; cursor: pointer; font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem; display: flex; align-items: center; justify-content: center;
            gap: 10px; transition: all 0.3s ease; box-shadow: inset 0 0 10px rgba(0,243,255,0.05);
            letter-spacing: 1px;
        }
        .new-chat-btn:hover { background: rgba(0, 243, 255, 0.1); box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }

        .chat-history { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
        .chat-history::-webkit-scrollbar { width: 4px; }
        .chat-history::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .history-item {
            padding: 12px 15px; border-radius: 8px; cursor: pointer;
            color: var(--text-muted); font-size: 0.85rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: all 0.2s;
            border-left: 2px solid transparent;
        }
        .history-item:hover, .history-item.active { 
            background: rgba(255,255,255,0.05); color: var(--text-main); 
            border-left: 2px solid var(--cyan);
        }

        .sidebar-footer { padding: 20px; border-top: 1px solid rgba(255,255,255,0.05); }
        .settings-btn {
            width: 100%; background: transparent; border: none; color: var(--text-muted);
            cursor: pointer; display: flex; align-items: center; gap: 10px;
            font-size: 0.85rem; padding: 10px; border-radius: 8px; transition: all 0.2s;
        }
        .settings-btn:hover { background: rgba(255,255,255,0.05); color: white; }

        .main-content {
            flex: 1; display: flex; flex-direction: column; position: relative;
            z-index: 10;
        }

        .hud-wrapper {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 75vmin; height: 75vmin;
            max-width: 800px; max-height: 800px;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; z-index: 0; opacity: 0.15;
            transition: all 0.5s ease;
        }

        .hud-wrapper.listening { opacity: 0.7; filter: drop-shadow(0 0 50px var(--accent)); }
        .hud-wrapper.speaking { opacity: 0.7; filter: drop-shadow(0 0 50px var(--speaking-color)); }

        .hud-wrapper::after {
            content: ''; position: absolute; width: 100%; height: 2px;
            background: rgba(0, 243, 255, 0.6); box-shadow: 0 0 20px var(--cyan);
            border-radius: 50%; animation: scan 3s linear infinite; opacity: 0.5;
        }
        @keyframes scan {
            0% { top: 5%; opacity: 0; transform: scaleX(0.8); }
            10% { opacity: 1; transform: scaleX(1); }
            90% { opacity: 1; transform: scaleX(1); }
            100% { top: 95%; opacity: 0; transform: scaleX(0.8); }
        }

        svg.hud-svg { width: 100%; height: 100%; overflow: visible; }
        .spin-slow { transform-origin: center; animation: rotate 60s linear infinite; }
        .spin-reverse { transform-origin: center; animation: rotate-reverse 40s linear infinite; }
        .spin-fast { transform-origin: center; animation: rotate 15s linear infinite; }
        .spin-reactor { transform-origin: center; animation: rotate 8s linear infinite; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        @keyframes rotate-reverse { 100% { transform: rotate(-360deg); } }

        .logo-text {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.5rem, 4vmin, 3rem);
            font-weight: 900;
            letter-spacing: 8px;
            color: #ffffff;
            text-shadow: 0 0 10px var(--cyan), 0 0 20px var(--cyan), 0 0 40px var(--cyan);
            z-index: 5;
            transition: all 0.5s ease;
            text-align: center;
        }

        .listening .logo-text { color: var(--accent); text-shadow: 0 0 15px var(--accent), 0 0 30px var(--accent); }
        .speaking .logo-text { color: var(--speaking-color); text-shadow: 0 0 15px var(--speaking-color), 0 0 30px var(--speaking-color); }

        .reactor-core {
            position: absolute; width: 40px; height: 40px;
            background: radial-gradient(circle, #ffffff 0%, var(--cyan) 30%, transparent 70%);
            border-radius: 50%; box-shadow: 0 0 30px var(--cyan), 0 0 60px var(--cyan);
            animation: pulse-reactor 2s infinite alternate;
            margin-top: -120px;
        }
        @keyframes pulse-reactor {
            0% { transform: scale(0.9); box-shadow: 0 0 20px var(--cyan); }
            100% { transform: scale(1.1); box-shadow: 0 0 40px var(--cyan), 0 0 80px var(--cyan); }
        }
        .listening .reactor-core { background: radial-gradient(circle, #ffffff 0%, var(--accent) 30%, transparent 70%); box-shadow: 0 0 30px var(--accent), 0 0 60px var(--accent); }
        .speaking .reactor-core { background: radial-gradient(circle, #ffffff 0%, var(--speaking-color) 30%, transparent 70%); box-shadow: 0 0 30px var(--speaking-color), 0 0 60px var(--speaking-color); }

        .chat-container {
            flex: 1; overflow-y: auto; padding: 30px 10%;
            display: flex; flex-direction: column; gap: 20px;
            scroll-behavior: smooth; z-index: 10; position: relative;
        }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.3); border-radius: 6px; }
        .chat-container::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

        .message { display: flex; gap: 15px; max-width: 100%; animation: fadeIn 0.4s ease; }
        .msg-avatar {
            width: 35px; height: 35px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0; font-family: 'Orbitron', sans-serif; font-weight: bold; font-size: 0.8rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .user-msg { flex-direction: row-reverse; }
        .user-msg .msg-avatar { background: #334155; color: white; }
        .user-msg .msg-content {
            background: linear-gradient(135deg, #1e293b, #0f172a); 
            padding: 12px 18px; border-radius: 12px 12px 0 12px;
            max-width: 80%; line-height: 1.5; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .ai-msg .msg-avatar { 
            background: rgba(0, 243, 255, 0.1); border: 1px solid var(--cyan); 
            color: var(--cyan); box-shadow: 0 0 15px rgba(0,243,255,0.3); 
        }
        .ai-msg .msg-content {
            background: var(--bg-panel); backdrop-filter: blur(15px);
            padding: 18px; border-radius: 12px;
            max-width: 90%; line-height: 1.6; color: var(--text-main);
            overflow-x: auto; border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .msg-content p { margin-bottom: 10px; }
        .msg-content p:last-child { margin-bottom: 0; }
        .msg-content pre {
            background: var(--code-bg); border: 1px solid #333;
            border-radius: 8px; padding: 12px; margin: 10px 0; overflow-x: auto;
        }
        .msg-content code {
            font-family: 'Share Tech Mono', monospace; font-size: 0.9rem;
            background: rgba(255,255,255,0.1); padding: 2px 5px;
            border-radius: 4px; color: var(--accent);
        }
        .msg-content pre code { background: transparent; padding: 0; color: #d4d4d4; }
        .msg-content ul, .msg-content ol { margin: 10px 0 10px 20px; }
        .msg-content strong { color: #fff; }

        .msg-actions { display: flex; gap: 10px; margin-top: 12px; opacity: 0; transition: opacity 0.2s; }
        .ai-msg:hover .msg-actions { opacity: 1; }
        .action-btn {
            background: transparent; border: none; color: var(--text-muted);
            cursor: pointer; display: flex; align-items: center; gap: 5px;
            font-size: 0.8rem; transition: color 0.2s;
        }
        .action-btn:hover { color: var(--cyan); }

        .typing-indicator {
            display: none; color: var(--cyan); font-size: 0.9rem;
            font-family: 'Share Tech Mono', monospace; margin-bottom: 20px;
            padding-left: 10%; z-index: 10; position: relative;
        }
        .typing-indicator.active { display: block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

        .input-container {
            padding: 20px 10%; background: linear-gradient(to top, var(--bg-dark) 60%, transparent);
            z-index: 10; position: relative;
        }

        .input-box {
            background: var(--bg-panel); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 12px 18px; display: flex; flex-direction: column;
            gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); transition: all 0.3s ease;
            backdrop-filter: blur(20px);
        }
        .input-box:focus-within { border-color: var(--cyan); box-shadow: 0 0 25px rgba(0, 243, 255, 0.2); }

        textarea {
            width: 100%; background: transparent; border: none; color: white;
            font-family: 'Inter', sans-serif; font-size: 1rem; resize: none; outline: none;
            max-height: 200px; min-height: 24px; line-height: 1.5;
        }
        textarea::placeholder { color: var(--text-muted); }

        .input-actions { display: flex; justify-content: space-between; align-items: center; }
        .left-actions, .right-actions { display: flex; align-items: center; gap: 10px; }

        .icon-btn {
            background: transparent; border: none; color: var(--text-muted);
            cursor: pointer; width: 38px; height: 38px; border-radius: 8px;
            display: flex; justify-content: center; align-items: center; transition: all 0.2s;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .icon-btn.listening { color: var(--speaking-color); background: rgba(255,0,234,0.1); animation: pulse 1s infinite; }

        .send-btn {
            background: var(--cyan); color: black; border: none;
            width: 38px; height: 38px; border-radius: 8px; cursor: pointer;
            display: flex; justify-content: center; align-items: center; transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }
        .send-btn:hover { background: #fff; box-shadow: 0 0 20px var(--cyan); transform: scale(1.05); }
        .send-btn:disabled { background: #334155; cursor: not-allowed; box-shadow: none; transform: none; }

        .lang-select {
            background: transparent; border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted); border-radius: 8px; padding: 8px 12px;
            outline: none; font-size: 0.8rem; cursor: pointer;
        }
        .lang-select option { background: var(--bg-dark); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            z-index: 1000; display: none; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-panel); border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 35px; width: 90%; max-width: 500px;
            box-shadow: 0 0 50px rgba(0,243,255,0.15);
        }
        .modal-content h2 { font-family: 'Orbitron', sans-serif; color: var(--cyan); margin-bottom: 25px; letter-spacing: 2px;}
        .setting-group { margin-bottom: 25px; }
        .setting-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted); }
        .setting-group input {
            width: 100%; background: var(--bg-dark); border: 1px solid #334155;
            color: white; padding: 14px; border-radius: 8px; outline: none; transition: border 0.3s;
        }
        .setting-group input:focus { border-color: var(--cyan); }
        .modal-close {
            background: var(--cyan); color: black; border: none; font-family: 'Orbitron';
            padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%;
            transition: all 0.2s;
        }
        .modal-close:hover { background: #fff; box-shadow: 0 0 20px var(--cyan); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .chat-container { padding: 20px 5%; }
            .input-container { padding: 20px 5%; }
            .hud-wrapper { width: 100vmin; height: 100vmin; opacity: 0.1; }
            .logo-text { font-size: 1.5rem; letter-spacing: 4px; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="window.jarvisObj.createNewChat()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                NEW SESSION
            </button>
        </div>
        <div class="chat-history" id="chatHistoryList"></div>
        <div class="sidebar-footer">
            <button class="settings-btn" onclick="document.getElementById('settingsModal').classList.add('active')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                SYSTEM SETTINGS
            </button>
        </div>
    </div>

    <div class="main-content">
        
        <div class="hud-wrapper" id="mainHud">
            <svg class="hud-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="5" result="blur" />
                        <feMerge><feMergeNode in="blur" /><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
                    </filter>
                    <mask id="top-mask"><rect x="0" y="0" width="800" height="400" fill="white" /></mask>
                    <mask id="bottom-mask"><rect x="0" y="400" width="800" height="400" fill="white" /></mask>
                    <mask id="left-mask"><rect x="0" y="0" width="400" height="800" fill="white" /></mask>
                    <mask id="right-mask"><rect x="400" y="0" width="400" height="800" fill="white" /></mask>
                </defs>
                
                <circle cx="400" cy="400" r="380" stroke="var(--cyan)" stroke-width="2" fill="none" stroke-dasharray="4 12" opacity="0.3" class="spin-slow" />
                <circle cx="400" cy="400" r="360" stroke="var(--cyan)" stroke-width="4" fill="none" stroke-dasharray="150 100 20 50 200 80 50 150" filter="url(#glow)" class="spin-reverse" />
                <circle cx="400" cy="400" r="330" stroke="var(--cyan)" stroke-width="8" fill="none" stroke-dasharray="80 200 50 100 150 200" opacity="0.5" class="spin-fast" />
                
                <circle cx="400" cy="400" r="280" stroke="var(--cyan)" stroke-width="15" fill="none" stroke-dasharray="2 10" opacity="0.6" mask="url(#top-mask)" />
                <circle cx="400" cy="400" r="260" stroke="var(--cyan)" stroke-width="3" fill="none" stroke-dasharray="250 1000" transform="rotate(-90 400 400)" opacity="0.8" />
                
                <circle cx="400" cy="400" r="240" stroke="var(--cyan)" stroke-width="30" fill="none" stroke-dasharray="4 10" mask="url(#left-mask)" filter="url(#glow)" opacity="0.7" />
                <circle cx="400" cy="400" r="240" stroke="var(--dark-cyan)" stroke-width="30" fill="none" stroke-dasharray="2 12" mask="url(#left-mask)" opacity="0.2" />
                <circle cx="400" cy="400" r="240" stroke="var(--cyan)" stroke-width="10" fill="none" stroke-dasharray="6 20" mask="url(#right-mask)" opacity="0.6" />
                <circle cx="400" cy="400" r="200" stroke="var(--cyan)" stroke-width="8" fill="none" stroke-dasharray="2 15" mask="url(#bottom-mask)" opacity="0.5" />

                <circle cx="400" cy="400" r="170" stroke="var(--cyan)" stroke-width="6" fill="none" filter="url(#glow)" class="spin-reactor" stroke-dasharray="120 30 60 30" />
                <circle cx="400" cy="400" r="150" stroke="rgba(0, 243, 255, 0.2)" stroke-width="2" fill="none" />
                <circle cx="400" cy="400" r="140" fill="rgba(0, 10, 20, 0.6)" />
            </svg>
            
            <div class="logo-text">J.A.R.V.I.S</div>
            <div class="reactor-core"></div>
        </div>

        <div class="chat-container" id="chatContainer"></div>

        <div class="typing-indicator" id="typingIndicator">J.A.R.V.I.S is thinking...</div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="chatInput" rows="1" placeholder="Awaiting command..." oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
                
                <div class="input-actions">
                    <div class="left-actions">
                        <label for="fileUpload" class="icon-btn" title="Attach File">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                        </label>
                        <input type="file" id="fileUpload" style="display:none;" accept=".txt,.md,.json,.js,.py,.html,.css,.csv">
                        
                        <select class="lang-select" id="langSelect" title="Select Language"></select>
                    </div>

                    <div class="right-actions">
                        <button class="send-btn" id="sendBtn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <h2>System Settings</h2>
            <div class="setting-group">
                <label>OpenAI API Key (Optional - For GPT-4/3.5)</label>
                <input type="password" id="apiKeyInput" placeholder="sk-...">
                <small style="color:var(--text-muted); font-size:0.75rem; display:block; margin-top:5px;">If empty, J.A.R.V.I.S uses a multi-tier free API.</small>
            </div>
            <div class="setting-group">
                <label>AI Voice Output</label>
                <select id="voiceToggle" style="width:100%; background:var(--bg-dark); color:white; padding:14px; border:1px solid #334155; border-radius:8px; outline:none;">
                    <option value="on">Enabled</option>
                    <option value="off">Muted (Text Only)</option>
                </select>
            </div>
            <button class="modal-close" onclick="document.getElementById('settingsModal').classList.remove('active'); window.jarvisObj.saveSettings();">Save Configuration</button>
        </div>
    </div>

    <script>
        class JarvisGPT {
            constructor() {
                this.chatContainer = document.getElementById('chatContainer');
                this.chatInput = document.getElementById('chatInput');
                this.sendBtn = document.getElementById('sendBtn');
                this.langSelect = document.getElementById('langSelect');
                this.typingIndicator = document.getElementById('typingIndicator');
                this.historyList = document.getElementById('chatHistoryList');
                this.mainHud = document.getElementById('mainHud');
                
                this.chats = JSON.parse(localStorage.getItem('jarvis_chats')) || {};
                this.currentChatId = null;
                this.isListening = false;
                this.isSpeaking = false;
                this.voiceEnabled = localStorage.getItem('jarvis_voice') !== 'off';
                this.apiKey = localStorage.getItem('jarvis_api_key') || '';
                this.currentLang = 'en-US';
                this.voices = [];
                
                this.recognition = null;
                this.finalTranscript = '';
                this.speechTimeout = null;

                this.init();
            }

            init() {
                try {
                    this.loadVoices();
                    this.setupSpeechRecognition();
                    this.setupEventListeners();

                    if (Object.keys(this.chats).length === 0) {
                        this.createNewChat();
                    } else {
                        const lastChatId = Object.keys(this.chats).sort((a,b) => this.chats[b].timestamp - this.chats[a].timestamp)[0];
                        this.loadChat(lastChatId);
                    }
                } catch (e) {
                    console.error("Initialization Error:", e);
                }
            }

            createNewChat() {
                const id = Date.now().toString();
                this.chats[id] = { title: 'New Conversation', messages: [], timestamp: Date.now() };
                this.currentChatId = id;
                this.chatContainer.innerHTML = '';
                this.saveToLocalStorage();
                this.renderHistoryList();
                this.addMessage('ai', 'Systems online. I am ready to assist you, sir.');
            }

            loadChat(id) {
                this.currentChatId = id;
                this.chatContainer.innerHTML = '';
                const chat = this.chats[id];
                
                if (chat.messages.length === 0) {
                    this.addMessage('ai', 'Systems online. I am ready to assist you, sir.');
                } else {
                    chat.messages.forEach(msg => {
                        this.addMessageUI(msg.role, msg.content);
                    });
                }
                this.renderHistoryList();
            }

            saveToLocalStorage() {
                if (this.currentChatId) {
                    const firstUserMsg = this.chats[this.currentChatId].messages.find(m => m.role === 'user');
                    if (firstUserMsg) {
                        this.chats[this.currentChatId].title = firstUserMsg.content.substring(0, 30) + '...';
                    }
                    this.chats[this.currentChatId].timestamp = Date.now();
                }
                localStorage.setItem('jarvis_chats', JSON.stringify(this.chats));
            }

            renderHistoryList() {
                this.historyList.innerHTML = '';
                const sortedChats = Object.entries(this.chats).sort((a,b) => b[1].timestamp - a[1].timestamp);
                
                sortedChats.forEach(([id, chat]) => {
                    const div = document.createElement('div');
                    div.className = `history-item ${id === this.currentChatId ? 'active' : ''}`;
                    div.innerText = chat.title;
                    div.onclick = () => this.loadChat(id);
                    this.historyList.appendChild(div);
                });
            }

            addMessage(role, text) {
                if (!this.chats[this.currentChatId]) return;
                this.chats[this.currentChatId].messages.push({ role, content: text });
                this.saveToLocalStorage();
                this.renderHistoryList();
                this.addMessageUI(role, text);
            }

            addMessageUI(role, text) {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${role === 'user' ? 'user-msg' : 'ai-msg'}`;
                
                const avatar = document.createElement('div');
                avatar.className = 'msg-avatar';
                avatar.innerText = role === 'user' ? 'USR' : 'J';
                
                const content = document.createElement('div');
                content.className = 'msg-content';
                
                if (role === 'ai') {
                    let html = marked.parse(text);
                    content.innerHTML = html;
                    content.querySelectorAll('pre code').forEach((block) => {
                        hljs.highlightElement(block);
                    });
                } else {
                    content.innerText = text;
                }

                msgDiv.appendChild(avatar);
                msgDiv.appendChild(content);

                if (role === 'ai') {
                    const actions = document.createElement('div');
                    actions.className = 'msg-actions';
                    
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'action-btn';
                    copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy';
                    copyBtn.onclick = () => {
                        navigator.clipboard.writeText(text);
                        copyBtn.innerText = 'Copied!';
                        setTimeout(() => copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy', 2000);
                    };
                    actions.appendChild(copyBtn);
                    content.appendChild(actions);
                }

                this.chatContainer.appendChild(msgDiv);
                this.scrollToBottom();
            }

            scrollToBottom() {
                this.chatContainer.scrollTop = this.chatContainer.scrollHeight;
            }

            async sendMessage(textOverride = null) {
                const text = textOverride || this.chatInput.value.trim();
                if (!text) return;

                this.chatInput.value = '';
                this.chatInput.style.height = 'auto';
                
                this.addMessage('user', text);
                this.sendBtn.disabled = true;
                this.typingIndicator.classList.add('active');
                this.scrollToBottom();

                const contextMessages = this.chats[this.currentChatId].messages.slice(-10).map(m => ({
                    role: m.role,
                    content: m.content
                }));

                const systemPrompt = `You are J.A.R.V.I.S., Tony Stark's AI. Be highly intelligent, witty, slightly sarcastic, and formal. Address the user as 'sir'. Format your responses beautifully using Markdown. Reply in this language: ${this.currentLang}.`;
                
                const payload = [
                    { role: "system", content: systemPrompt },
                    ...contextMessages
                ];

                let aiReply = null;

                // --- TIER 1: Official OpenAI ---
                if (this.apiKey) {
                    try {
                        const res = await fetch("https://api.openai.com/v1/chat/completions", {
                            method: "POST",
                            headers: { 
                                "Content-Type": "application/json",
                                "Authorization": `Bearer ${this.apiKey}`
                            },
                            body: JSON.stringify({
                                model: "gpt-3.5-turbo",
                                messages: payload,
                                max_tokens: 600
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            aiReply = data.choices[0].message.content;
                        }
                    } catch (e) { console.warn("OpenAI API failed."); }
                }

                // --- TIER 2: Pollinations (New Gen Gateway) ---
                if (!aiReply) {
                    try {
                        const res = await fetch("https://gen.pollinations.ai/v1/chat/completions", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                model: "openai",
                                messages: payload,
                                max_tokens: 600
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data.choices && data.choices[0].message.content) {
                                aiReply = data.choices[0].message.content;
                            }
                        }
                    } catch (e) { console.warn("Tier 2 (Pollinations Gen) failed."); }
                }

                // --- TIER 3: KeylessAI ---
                if (!aiReply) {
                    try {
                        const res = await fetch("https://keylessai.thryx.workers.dev/v1/chat/completions", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                model: "gpt-3.5-turbo",
                                messages: payload,
                                max_tokens: 600
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data.choices && data.choices[0].message.content) {
                                aiReply = data.choices[0].message.content;
                            }
                        }
                    } catch (e) { console.warn("Tier 3 (KeylessAI) failed."); }
                }

                // --- TIER 4: Api.Airforce ---
                if (!aiReply) {
                    try {
                        const res = await fetch("https://api.airforce/v1/chat/completions", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                model: "gpt-3.5-turbo",
                                messages: payload,
                                max_tokens: 600
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data.choices && data.choices[0].message.content) {
                                aiReply = data.choices[0].message.content;
                            }
                        }
                    } catch (e) { console.warn("Tier 4 (Api.Airforce) failed."); }
                }

                // --- FINAL FALLBACK ---
                if (!aiReply) {
                    aiReply = "All neural network routes are currently offline, sir. Please check your internet connection or configure an API key in the settings.";
                }

                this.typingIndicator.classList.remove('active');
                this.addMessage('ai', aiReply);
                this.sendBtn.disabled = false;

                if (this.voiceEnabled) {
                    this.speak(aiReply);
                }
                
                // Resume listening after AI finishes speaking
                setTimeout(() => {
                    if (!this.isListening && this.recognition) {
                        try { this.recognition.start(); } catch(e) {}
                    }
                }, 500);
            }

            speak(text) {
                if (!text) return;
                
                let cleanText = text
                    .replace(/```[\s\S]*?```/g, ' [Code Block] ') 
                    .replace(/`([^`]+)`/g, '$1')
                    .replace(/[*_#>-]/g, '')
                    .trim();

                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = this.currentLang;
                
                const voice = this.voices.find(v => v.lang === this.currentLang) || this.voices[0];
                if (voice) utterance.voice = voice;
                
                utterance.rate = 1.05;
                utterance.pitch = 0.9;

                utterance.onstart = () => { 
                    this.isSpeaking = true;
                    this.mainHud.classList.remove('listening');
                    this.mainHud.classList.add('speaking'); 
                };
                utterance.onend = () => { 
                    this.isSpeaking = false;
                    this.mainHud.classList.remove('speaking'); 
                };
                
                window.speechSynthesis.speak(utterance);
            }

            setupSpeechRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    console.warn("Speech Recognition not supported.");
                    return;
                }

                this.recognition = new SpeechRecognition();
                this.recognition.continuous = true; // Keep listening
                this.recognition.interimResults = true; // Get real-time words
                this.recognition.lang = this.currentLang;

                this.recognition.onstart = () => {
                    this.isListening = true;
                    this.mainHud.classList.add('listening');
                };

                this.recognition.onresult = (event) => {
                    if (!this.isListening) return;

                    // Stop speaking if user interrupts
                    if (this.isSpeaking) {
                        window.speechSynthesis.cancel();
                        this.isSpeaking = false;
                        this.mainHud.classList.remove('speaking');
                    }

                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            this.finalTranscript += event.results[i][0].transcript + ' ';
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }

                    const currentText = (this.finalTranscript + interimTranscript).toLowerCase().trim();

                    // Wake Word Detection
                    if (currentText.includes('jarvis') || currentText.includes('जार्विस')) {
                        this.mainHud.classList.add('listening');
                        
                        // Extract command if spoken after wake word
                        const command = currentText.replace(/jarvis|जार्विस/gi, '').replace(/,/g, '').trim();
                        
                        if (command.length > 0) {
                            // Command detected immediately
                            this.finalTranscript = '';
                            this.sendMessage(command);
                        } else {
                            // Just said "Jarvis", wait for command
                            clearTimeout(this.speechTimeout);
                            this.speechTimeout = setTimeout(() => {
                                // If no command after 3 seconds, reset
                                this.finalTranscript = '';
                            }, 3000);
                        }
                    }
                };

                this.recognition.onerror = (event) => {
                    console.warn("Speech recognition error:", event.error);
                    if (event.error === 'not-allowed') {
                        this.addMessage('system', 'Microphone access denied. Please allow mic permissions.');
                        this.isListening = false;
                        this.mainHud.classList.remove('listening');
                    }
                };

                this.recognition.onend = () => {
                    this.isListening = false;
                    this.mainHud.classList.remove('listening');
                    
                    // Auto-restart listening (continuous mode)
                    if (this.voiceEnabled && !this.isSpeaking) {
                        setTimeout(() => {
                            try { this.recognition.start(); } catch(e) {}
                        }, 500);
                    }
                };
                
                // Start listening immediately
                try { this.recognition.start(); } catch(e) {}
            }

            setupEventListeners() {
                this.sendBtn.addEventListener('click', () => this.sendMessage());
                
                this.chatInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });

                document.getElementById('fileUpload').addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const content = event.target.result;
                        this.chatInput.value = `I have attached a file named "${file.name}". Here are its contents:\n\n\`\`\`\n${content.substring(0, 3000)}\n\`\`\`\n\nPlease review this file and summarize it.`;
                        this.chatInput.style.height = this.chatInput.scrollHeight + 'px';
                    };
                    reader.readAsText(file);
                });

                this.langSelect.addEventListener('change', (e) => {
                    this.currentLang = e.target.value;
                    if (this.recognition) this.recognition.lang = this.currentLang;
                });
            }

            saveSettings() {
                const key = document.getElementById('apiKeyInput').value.trim();
                const voice = document.getElementById('voiceToggle').value;
                
                localStorage.setItem('jarvis_api_key', key);
                localStorage.setItem('jarvis_voice', voice);
                
                this.apiKey = key;
                this.voiceEnabled = (voice === 'on');
            }

            loadVoices() {
                const populateVoices = () => {
                    this.voices = window.speechSynthesis.getVoices();
                    if (this.voices.length === 0) return;

                    const nativeNames = {
                        'en': 'English', 'es': 'Español', 'fr': 'Français', 'de': 'Deutsch',
                        'it': 'Italiano', 'pt': 'Português', 'ru': 'Русский', 'ja': '日本語',
                        'ko': '한국어', 'zh': '中文', 'hi': 'हिन्दी', 'ar': 'العربية'
                    };

                    const uniqueLangs = new Set();
                    this.langSelect.innerHTML = '';

                    this.voices.forEach(voice => {
                        if (uniqueLangs.has(voice.lang)) return;
                        uniqueLangs.add(voice.lang);

                        let baseLang = voice.lang.split('-')[0].toLowerCase();
                        let nativeName = nativeNames[baseLang] || voice.lang;
                        
                        const option = document.createElement('option');
                        option.value = voice.lang;
                        option.innerText = `${nativeName} (${voice.lang})`;
                        this.langSelect.appendChild(option);
                    });

                    this.langSelect.value = this.voices.find(v => v.lang === 'en-US') ? 'en-US' : this.voices[0].lang;
                };

                populateVoices();
                window.speechSynthesis.onvoiceschanged = populateVoices;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.jarvisObj = new JarvisGPT();
        });
    </script>
