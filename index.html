<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S - Advanced Neural Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f3ff;
            --dark-cyan: #0066aa;
            --bg-color: #010306;
            --glass-bg: rgba(0, 8, 16, 0.75);
            --glass-border: rgba(0, 243, 255, 0.2);
            --accent: #00ffcc;
            --speaking-color: #ff00ea;
            --text-glow: 0 0 10px var(--cyan), 0 0 20px var(--cyan);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: white;
            position: relative;
        }

        /* --- HIGH-TECH BACKGROUND --- */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.04) 0%, transparent 60%),
                linear-gradient(rgba(0, 243, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            pointer-events: none;
            z-index: 0;
        }

        /* --- HUD CIRCLE --- */
        .hud-wrapper {
            position: relative;
            width: 70vmin;
            height: 70vmin;
            max-width: 600px;
            max-height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.5s ease;
            margin-bottom: 20px;
            pointer-events: none;
            z-index: 10;
        }

        /* Scanline Effect */
        .hud-wrapper::after {
            content: '';
            position: absolute;
            width: 100%; height: 3px;
            background: rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 15px var(--cyan);
            border-radius: 50%;
            animation: scan 3s linear infinite;
            opacity: 0.4;
        }

        @keyframes scan {
            0% { top: 5%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 95%; opacity: 0; }
        }

        .hud-wrapper.passive { filter: brightness(0.8); transform: scale(0.95); }
        .hud-wrapper.wake-word { filter: brightness(1.5); transform: scale(1.05); }
        .hud-wrapper.listening { transform: scale(1.08); filter: drop-shadow(0 0 40px rgba(0, 255, 204, 0.5)); }
        .hud-wrapper.speaking { transform: scale(1.05); filter: drop-shadow(0 0 40px rgba(255, 0, 234, 0.5)); }

        svg.hud-svg { width: 100%; height: 100%; overflow: visible; }
        .spin-slow { transform-origin: center; animation: rotate 60s linear infinite; }
        .spin-reverse { transform-origin: center; animation: rotate-reverse 40s linear infinite; }
        .spin-fast { transform-origin: center; animation: rotate 15s linear infinite; }
        .spin-reactor { transform-origin: center; animation: rotate 8s linear infinite; }

        @keyframes rotate { 100% { transform: rotate(360deg); } }
        @keyframes rotate-reverse { 100% { transform: rotate(-360deg); } }

        /* --- CENTER REACTOR --- */
        .center-content {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .reactor-core {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #ffffff 0%, var(--cyan) 40%, transparent 80%);
            border-radius: 50%;
            box-shadow: 0 0 30px var(--cyan), 0 0 60px var(--cyan);
            margin-bottom: 20px;
            animation: pulse-reactor 2s infinite alternate;
        }

        @keyframes pulse-reactor {
            0% { transform: scale(0.9); box-shadow: 0 0 20px var(--cyan); }
            100% { transform: scale(1.1); box-shadow: 0 0 40px var(--cyan), 0 0 80px var(--cyan); }
        }

        .status-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 5px;
            color: var(--cyan);
            text-transform: uppercase;
            text-shadow: var(--text-glow);
            transition: all 0.3s ease;
        }
        
        .listening .status-text { color: var(--accent); text-shadow: 0 0 20px var(--accent); }
        .speaking .status-text { color: var(--speaking-color); text-shadow: 0 0 20px var(--speaking-color); }

        /* --- CHAT INTERFACE --- */
        .ui-container {
            position: absolute;
            bottom: 3%;
            width: 95%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
        }

        .chat-log-wrapper {
            position: relative;
            width: 100%;
        }

        /* Sci-Fi Side Brackets */
        .side-bracket {
            position: absolute;
            width: 3px;
            height: 60%;
            background: var(--cyan);
            box-shadow: 0 0 10px var(--cyan);
            top: 20%;
        }
        .left-bracket { left: -5px; border-radius: 5px 0 0 5px; }
        .right-bracket { right: -5px; border-radius: 0 5px 5px 0; }

        .chat-log {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 5px; /* Sharper edges for a tactical look */
            padding: 20px;
            height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: inset 0 0 40px rgba(0, 243, 255, 0.05), 0 15px 50px rgba(0, 0, 0, 0.8);
            scrollbar-width: thin;
            scrollbar-color: var(--cyan) transparent;
            cursor: text;
        }

        .chat-log::-webkit-scrollbar { width: 4px; }
        .chat-log::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 10px; }

        .message { font-size: 0.95rem; line-height: 1.6; animation: fadeIn 0.3s ease; }
        .msg-user { 
            color: #8899aa; 
            text-align: right; 
            font-family: 'Share Tech Mono', monospace;
        }
        .msg-ai { 
            color: var(--cyan); 
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.4); 
            font-family: 'Inter', sans-serif;
            border-left: 2px solid var(--cyan);
            padding-left: 10px;
        }
        .msg-system { 
            color: var(--speaking-color); 
            font-style: italic; 
            font-size: 0.85rem; 
            text-align: center; 
            opacity: 0.8;
            font-family: 'Share Tech Mono', monospace;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .input-bar {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-bar input[type="text"] {
            flex: 1;
            background: rgba(0, 5, 10, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 5px;
            padding: 18px 25px;
            color: var(--cyan);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 5px 15px rgba(0,0,0,0.5);
            cursor: text;
        }

        .input-bar input[type="text"]::placeholder {
            color: rgba(0, 243, 255, 0.4);
        }

        .input-bar input[type="text"]:focus {
            border-color: var(--cyan);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9), 0 0 25px rgba(0, 243, 255, 0.3);
        }

        /* --- PREMIUM BUTTONS --- */
        .icon-btn, .upload-btn {
            background: linear-gradient(135deg, rgba(0,243,255,0.15), rgba(0,50,100,0.1));
            border: 1px solid var(--cyan);
            border-radius: 5px;
            width: 58px;
            height: 58px;
            color: var(--cyan);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0,243,255,0.1), 0 0 15px rgba(0, 243, 255, 0.2);
            flex-shrink: 0;
        }

        .upload-btn {
            background: rgba(0, 5, 10, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: #8899aa;
        }

        .icon-btn:hover, .upload-btn:hover {
            box-shadow: inset 0 0 20px rgba(0,243,255,0.4), 0 0 30px rgba(0, 243, 255, 0.7);
            transform: translateY(-2px);
            border-color: #fff;
            color: #fff;
        }
        
        .icon-btn:active, .upload-btn:active { transform: scale(0.95); }

        /* Audio Visualizer */
        .visualizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            height: 30px;
            margin-top: 5px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .visualizer.active { opacity: 1; }
        .bar { width: 4px; height: 6px; background: var(--cyan); border-radius: 2px; box-shadow: 0 0 10px var(--cyan); }
        
        .listening .bar { animation: sound-wave 0.7s ease-in-out infinite alternate; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .speaking .bar { animation: sound-wave 0.4s ease-in-out infinite alternate; background: var(--speaking-color); box-shadow: 0 0 10px var(--speaking-color); }
        
        .bar:nth-child(1) { animation-delay: 0.0s; }
        .bar:nth-child(2) { animation-delay: 0.15s; }
        .bar:nth-child(3) { animation-delay: 0.3s; }
        .bar:nth-child(4) { animation-delay: 0.45s; }
        .bar:nth-child(5) { animation-delay: 0.2s; }
        .bar:nth-child(6) { animation-delay: 0.35s; }
        .bar:nth-child(7) { animation-delay: 0.1s; }
        .bar:nth-child(8) { animation-delay: 0.25s; }

        @keyframes sound-wave { 0% { height: 5px; } 100% { height: 28px; } }
    </style>
</head>
<body>

    <div class="hud-wrapper passive" id="hud">
        <svg class="hud-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="4" result="blur" />
                    <feMerge><feMergeNode in="blur" /><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
                </filter>
                <mask id="top-mask"><rect x="0" y="0" width="800" height="400" fill="white" /></mask>
                <mask id="bottom-mask"><rect x="0" y="400" width="800" height="400" fill="white" /></mask>
                <mask id="left-mask"><rect x="0" y="0" width="400" height="800" fill="white" /></mask>
                <mask id="right-mask"><rect x="400" y="0" width="400" height="800" fill="white" /></mask>
            </defs>
            <!-- Outer Rings -->
            <circle cx="400" cy="400" r="380" stroke="var(--cyan)" stroke-width="1.5" fill="none" stroke-dasharray="2 10" opacity="0.4" class="spin-slow" />
            <circle cx="400" cy="400" r="360" stroke="var(--cyan)" stroke-width="3" fill="none" stroke-dasharray="150 100 20 50 200 80 50 150" filter="url(#glow)" class="spin-reverse" />
            <circle cx="400" cy="400" r="330" stroke="var(--cyan)" stroke-width="6" fill="none" stroke-dasharray="80 200 50 100 150 200" opacity="0.6" class="spin-fast" />
            
            <!-- Mid Ticks -->
            <circle cx="400" cy="400" r="280" stroke="var(--cyan)" stroke-width="12" fill="none" stroke-dasharray="2 8" opacity="0.7" mask="url(#top-mask)" />
            <circle cx="400" cy="400" r="260" stroke="var(--cyan)" stroke-width="2" fill="none" stroke-dasharray="250 1000" transform="rotate(-90 400 400)" opacity="0.8" />
            
            <!-- Segments -->
            <circle cx="400" cy="400" r="250" stroke="var(--cyan)" stroke-width="25" fill="none" stroke-dasharray="3 8" mask="url(#left-mask)" filter="url(#glow)" />
            <circle cx="400" cy="400" r="250" stroke="var(--dark-cyan)" stroke-width="25" fill="none" stroke-dasharray="2 9" mask="url(#left-mask)" opacity="0.3" />
            <circle cx="400" cy="400" r="250" stroke="var(--cyan)" stroke-width="8" fill="none" stroke-dasharray="4 16" mask="url(#right-mask)" opacity="0.8" />
            <circle cx="400" cy="400" r="210" stroke="var(--cyan)" stroke-width="6" fill="none" stroke-dasharray="2 12" mask="url(#bottom-mask)" opacity="0.6" />

            <!-- Inner Arc Reactor Ring -->
            <circle cx="400" cy="400" r="170" stroke="var(--cyan)" stroke-width="5" fill="none" filter="url(#glow)" class="spin-reactor" stroke-dasharray="100 20 50 20" />
            <circle cx="400" cy="400" r="160" stroke="rgba(0, 243, 255, 0.3)" stroke-width="2" fill="none" />
            
            <!-- Center Core Background -->
            <circle cx="400" cy="400" r="150" fill="#000a10" opacity="0.9" />
        </svg>

        <!-- CENTER CONTENT -->
        <div class="center-content">
            <div class="reactor-core"></div>
            <div class="status-text" id="statusText">J.A.R.V.I.S.</div>
        </div>
    </div>

    <div class="ui-container">
        <div class="chat-log-wrapper">
            <div class="side-bracket left-bracket"></div>
            <div class="side-bracket right-bracket"></div>
            
            <div class="chat-log" id="chatLog">
                <div class="message msg-system">System online. Neural link established.</div>
            </div>
        </div>
        
        <div class="visualizer" id="visualizer" style="align-self: center;">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>

        <div class="input-bar">
            <label for="fileUpload" class="upload-btn" title="Upload Data">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                </svg>
            </label>
            <input type="file" id="fileUpload" style="display: none;">

            <input type="text" id="chatInput" placeholder="Awaiting command..." autocomplete="off">
            
            <button class="icon-btn" id="sendBtn" title="Transmit">
                <svg width="22" height="22" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="15,20 80,50 15,50" fill="currentColor"/>
                    <polygon points="15,80 80,50 15,50" fill="currentColor"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const hud = document.getElementById('hud');
        const chatLog = document.getElementById('chatLog');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusText = document.getElementById('statusText');
        const visualizer = document.getElementById('visualizer');
        const fileUpload = document.getElementById('fileUpload');

        // --- State Variables ---
        let isSystemActive = false;
        let isSpeaking = false;
        let isAwake = false; 
        let chatHistory = []; 
        
        // Voice Recognition Variables
        let finalTranscript = '';
        let interimTranscript = '';
        let speechTimeout = null; 

        // --- Web Speech API Setup ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true; 
            recognition.interimResults = true; 
            recognition.lang = 'en-US';
        }

        const synth = window.speechSynthesis;

        // --- UI Functions ---
        function updateState(state) {
            hud.className = 'hud-wrapper';
            visualizer.className = 'visualizer';
            
            if (state === 'passive') {
                hud.classList.add('passive');
                statusText.innerText = "J.A.R.V.I.S.";
            } else if (state === 'wake') {
                hud.classList.add('wake-word');
                statusText.innerText = "ONLINE";
            } else if (state === 'listening') {
                hud.classList.add('listening');
                visualizer.classList.add('active');
                statusText.innerText = "LISTENING";
            } else if (state === 'processing') {
                hud.classList.add('wake-word');
                statusText.innerText = "COMPUTING";
            } else if (state === 'speaking') {
                hud.classList.add('speaking');
                visualizer.classList.add('active');
                statusText.innerText = "TRANSMITTING";
            }
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message msg-${sender}`;
            msgDiv.innerText = text;
            chatLog.appendChild(msgDiv);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        // --- Seamless Initialization ---
        function initSystem() {
            if (isSystemActive) return;
            isSystemActive = true;
            
            const u = new SpeechSynthesisUtterance("");
            synth.speak(u); 

            setTimeout(() => {
                updateState('passive');
                if (recognition) {
                    try { recognition.start(); } catch(e) {}
                }
            }, 300);
        }

        document.body.addEventListener('mousemove', initSystem, { once: true });
        document.body.addEventListener('keydown', initSystem, { once: true });

        // --- File Upload Handling ---
        fileUpload.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const fileName = e.target.files[0].name;
                addMessage(`Uploaded data file: ${fileName}`, 'user');
                setTimeout(() => {
                    speakResponse(`I have received the file ${fileName}, sir. My data-parsing subroutines are currently restricted.`);
                }, 500);
            }
        });

        // --- THE CORE LISTENING LOGIC ---
        recognition.onresult = (event) => {
            if (!isSystemActive) return;

            // 1. Voice Interruption
            if (isSpeaking) {
                synth.cancel();
                isSpeaking = false;
                updateState('passive');
            }

            // 2. Gather spoken words
            interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript + ' ';
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }

            const currentFullText = (finalTranscript + interimTranscript).toLowerCase().trim();

            // 3. Check for Wake Word ("Jarvis")
            if (!isAwake && currentFullText.includes('jarvis')) {
                isAwake = true;
                updateState('wake');
                
                finalTranscript = currentFullText.replace(/jarvis/gi, '').replace(/,/g, '').trim() + ' ';
                
                if (finalTranscript.trim().length === 0) {
                    speakResponse("Yes sir? I am listening.");
                    clearTimeout(speechTimeout);
                    return;
                }
            }

            // 4. Wait for the user to STOP speaking before processing
            if (isAwake) {
                updateState('listening');
                
                clearTimeout(speechTimeout);
                
                // ⚡ WAIT ONLY 0.6 SECONDS OF SILENCE BEFORE EXECUTING ⚡
                speechTimeout = setTimeout(() => {
                    const commandToProcess = finalTranscript.replace(/jarvis/gi, '').replace(/,/g, '').trim();
                    
                    if (commandToProcess.length > 0) {
                        finalTranscript = ''; 
                        interimTranscript = '';
                        isAwake = false; 
                        processUserInput(commandToProcess);
                    }
                }, 600); 
            }
        };

        recognition.onerror = (event) => {
            if (event.error === 'not-allowed') {
                addMessage("Microphone access denied. Please allow mic permissions in your browser.", "system");
                isSystemActive = false;
            }
        };

        recognition.onend = () => {
            if (isSystemActive && !isSpeaking) {
                try { recognition.start(); } catch(e) {}
            }
        };

        // --- Text Chat Input ---
        function handleTextSubmit() {
            initSystem(); 
            const text = chatInput.value.trim();
            if (text) {
                processUserInput(text);
                chatInput.value = '';
            }
        }

        sendBtn.addEventListener('click', handleTextSubmit);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleTextSubmit();
        });

        // --- ADVANCED PROCESSING & LOCAL COMMANDS ---
        async function processUserInput(text) {
            const lowerText = text.toLowerCase();

            // 1. LOCAL COMMANDS (No API needed)
            if (lowerText.includes('clear chat') || lowerText.includes('clear history')) {
                chatLog.innerHTML = '<div class="message msg-system">Terminal cleared.</div>';
                speakResponse("Terminal cleared, sir.");
                return;
            }
            if (lowerText.includes('go to sleep') || lowerText.includes('shut down')) {
                speakResponse("Entering standby mode.");
                isSystemActive = false;
                if(recognition) recognition.stop();
                return;
            }

            // 2. API PROCESSING
            addMessage(text, 'user');
            updateState('processing');
            
            if(recognition) recognition.stop(); 

            chatHistory.push({ role: "User", content: text });
            if(chatHistory.length > 8) chatHistory.shift(); // Keep memory buffer

            try {
                // ADVANCED SYSTEM PROMPT
                let contextStr = "You are J.A.R.V.I.S., the highly advanced AI created by Tony Stark. You are extremely intelligent, witty, slightly sarcastic, and highly formal. You must always address the user as 'sir' or 'madam'. Keep your verbal responses incredibly concise (1 to 3 sentences maximum) as they are being spoken aloud. Do not use emojis. Do not break character. ";
                
                chatHistory.forEach(msg => {
                    contextStr += `\n${msg.role}: ${msg.content}`;
                });
                contextStr += "\nJ.A.R.V.I.S:";

                const fullPrompt = encodeURIComponent(contextStr);
                const response = await fetch(`https://text.pollinations.ai/${fullPrompt}`);
                
                if (!response.ok) throw new Error(`API Error`);

                let aiReply = await response.text();
                aiReply = aiReply.trim();

                // Clean up AI output
                if (aiReply.startsWith("J.A.R.V.I.S:") || aiReply.startsWith("J.A.R.V.I.S.")) {
                    aiReply = aiReply.replace(/J\.A\.R\.V\.I\.S\.?\s*/gi, "").trim();
                }
                
                chatHistory.push({ role: "J.A.R.V.I.S", content: aiReply });

                addMessage(aiReply, 'ai');
                speakResponse(aiReply);

            } catch (error) {
                let errorMsg = "My connection to the mainframe is experiencing interference, sir. Please try again.";
                addMessage(errorMsg, 'ai');
                speakResponse(errorMsg);
            }
        }

        // --- Text-to-Speech (TTS) ---
        function speakResponse(text) {
            isSpeaking = true;
            updateState('speaking');
            if(recognition) recognition.stop(); 

            const utterance = new SpeechSynthesisUtterance(text);
            
            const voices = synth.getVoices();
            // Advanced voice selection: prioritize British Male voices
            const preferredVoice = voices.find(v => v.lang === 'en-GB' && v.name.includes('Male')) || 
                                   voices.find(v => v.name.includes('Google UK English Male')) ||
                                   voices.find(v => v.lang === 'en-GB') || 
                                   voices[0];
            
            if (preferredVoice) utterance.voice = preferredVoice;
            utterance.rate = 1.05;
            utterance.pitch = 0.9;
            utterance.volume = 1.0;

            utterance.onend = () => {
                isSpeaking = false;
                updateState('passive');
                
                finalTranscript = '';
                interimTranscript = '';
                
                if(recognition && isSystemActive) {
                    try { recognition.start(); } catch(e) {}
                }
            };

            synth.speak(utterance);
        }

        // Load voices
        window.speechSynthesis.onvoiceschanged = () => { synth.getVoices(); };
        synth.getVoices();

    </script>
</body>
</html>
