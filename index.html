<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>JARVIS — Fused Multi-AI Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ================= BASE ================= */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#000;
  --panel:rgba(10,10,10,.78);
  --border:rgba(255,255,255,.10);
  --text:#f2f2f2;
  --muted:#8a8a8a;
  --muted2:#5a5a5a;
}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:#000;color:var(--text);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3)}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none !important}

/* ================= BACKGROUND ================= */
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.glowLayer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.glow{
  position:absolute;border-radius:50%;filter:blur(130px);
  background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%);
  animation:drift 24s ease-in-out infinite;will-change:transform;
}
.glow.a{width:520px;height:520px;top:-180px;left:-160px}
.glow.b{width:460px;height:460px;bottom:-200px;right:-160px;animation-delay:-8s;opacity:.7}
.glow.c{width:380px;height:380px;top:42%;left:55%;animation-delay:-14s;opacity:.5}
.glow.d{width:300px;height:300px;bottom:15%;left:10%;animation-delay:-5s;opacity:.35}
@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(60px,-70px) scale(1.15)}
  66%{transform:translate(-50px,60px) scale(.9)}
}
.gridOverlay{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 10%,transparent 75%);
  mask-image:radial-gradient(circle at 50% 40%,#000 10%,transparent 75%);
  animation:gridMove 40s linear infinite;
}
@keyframes gridMove{from{background-position:0 0,0 0}to{background-position:64px 64px,64px 64px}}

/* ================= AUTH ================= */
#authScreen{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  padding:20px;overflow:auto;
}
.authCard{
  position:relative;width:min(430px,100%);
  padding:36px 32px 32px;border-radius:24px;
  background:rgba(10,10,10,.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--border);
  box-shadow:0 50px 120px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.05) inset;
  animation:popIn .6s cubic-bezier(.2,.9,.3,1.3);
}
@keyframes popIn{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
.authCard::before{
  content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;
  background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.05),rgba(255,255,255,.4));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}
.brandLogo{
  font-size:36px;font-weight:800;letter-spacing:10px;text-align:center;
  background:linear-gradient(135deg,#fff 0%,#888 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:logoPulse 3.4s ease-in-out infinite;
}
@keyframes logoPulse{
  0%,100%{filter:drop-shadow(0 0 18px rgba(255,255,255,.25));opacity:.95}
  50%{filter:drop-shadow(0 0 34px rgba(255,255,255,.6));opacity:1}
}
.brandSub{text-align:center;color:var(--muted);font-size:11px;margin:10px 0 26px;letter-spacing:2.4px;text-transform:uppercase}
.fusionBadges{
  display:flex;justify-content:center;gap:7px;margin-bottom:22px;flex-wrap:wrap;
}
.fusionBadges span{
  font-size:9.5px;font-weight:600;letter-spacing:.5px;padding:4px 9px;border-radius:20px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#aaa;
  animation:badgeIn .5s backwards;
}
.fusionBadges span:nth-child(1){animation-delay:.15s}
.fusionBadges span:nth-child(2){animation-delay:.25s}
.fusionBadges span:nth-child(3){animation-delay:.35s}
.fusionBadges span:nth-child(4){animation-delay:.45s}
.fusionBadges span:nth-child(5){animation-delay:.55s}
@keyframes badgeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.tabs{display:flex;gap:6px;background:rgba(255,255,255,.045);padding:5px;border-radius:14px;margin-bottom:22px}
.tab{
  flex:1;padding:11px;border:0;border-radius:10px;background:transparent;color:var(--muted);
  font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.3s;letter-spacing:.3px;
}
.tab.active{background:#fff;color:#000;box-shadow:0 6px 22px rgba(255,255,255,.25)}
.tab:not(.active):hover{color:#ccc}
.field{margin-bottom:13px}
.field input{
  width:100%;padding:14px 16px;border-radius:13px;
  background:rgba(255,255,255,.045);border:1px solid var(--border);
  color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.3s;
}
.field input::placeholder{color:var(--muted2)}
.field input:focus{
  border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.08);
  box-shadow:0 0 0 4px rgba(255,255,255,.06);
}
.btn{font-family:inherit;font-weight:600;cursor:pointer;border:0;border-radius:13px;transition:.28s;font-size:14px}
.btnPrimary{
  width:100%;padding:14px;color:#000;background:#fff;
  box-shadow:0 10px 32px rgba(255,255,255,.22);position:relative;overflow:hidden;
}
.btnPrimary:hover{transform:translateY(-2px);box-shadow:0 16px 42px rgba(255,255,255,.35);background:#f2f2f2}
.btnPrimary:active{transform:translateY(0) scale(.985)}
.btnPrimary::after{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transition:.6s;
}
.btnPrimary:hover::after{left:100%}
.errBox{
  display:none;margin-bottom:14px;padding:11px 14px;border-radius:11px;font-size:13px;line-height:1.5;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);color:#e5e5e5;
  animation:shake .4s;
}
.errBox.show{display:block}
.errBox.ok{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4);color:#fff;font-weight:600}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(4px)}
}

/* ================= APP ================= */
#app{position:relative;z-index:10;display:flex;height:100vh;width:100%}

.sidebar{
  width:270px;flex-shrink:0;display:flex;flex-direction:column;
  background:rgba(6,6,6,.88);backdrop-filter:blur(22px);
  border-right:1px solid var(--border);transition:transform .35s cubic-bezier(.4,0,.2,1);
}
.sideTop{padding:20px 16px 12px}
.sideBrand{
  font-size:18px;font-weight:800;letter-spacing:6px;
  background:linear-gradient(135deg,#fff,#777);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sideBrandSub{font-size:9px;color:var(--muted2);letter-spacing:1.4px;margin-top:3px}
.newChatBtn{
  width:100%;margin-top:16px;padding:12px;border-radius:12px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.28s;
}
.newChatBtn:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.3);transform:translateY(-2px)}
.chatList{flex:1;overflow-y:auto;padding:8px 10px}
.chatItem{
  display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:11px;
  color:var(--muted);font-size:12.5px;cursor:pointer;transition:.22s;margin-bottom:4px;
  border:1px solid transparent;white-space:nowrap;overflow:hidden;
  animation:slideIn .4s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.chatItem span{flex:1;overflow:hidden;text-overflow:ellipsis}
.chatItem:hover{background:rgba(255,255,255,.06);color:#fff;transform:translateX(2px)}
.chatItem.active{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.22);color:#fff}
.chatItem .del{opacity:0;font-size:16px;padding:0 3px;border-radius:5px;transition:.22s;color:#888}
.chatItem:hover .del{opacity:.7}
.chatItem .del:hover{opacity:1;background:rgba(255,255,255,.15);color:#fff}
.sideBottom{padding:12px;border-top:1px solid var(--border)}
.userChip{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;
  background:rgba(255,255,255,.04);margin-bottom:9px;
}
.avatar{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,#fff,#888);display:grid;place-items:center;
  font-weight:800;font-size:13px;color:#000;
}
.userInfo{overflow:hidden}
.userInfo b{display:block;font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userInfo small{font-size:10.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sideBtn{
  width:100%;padding:10px;margin-top:6px;border-radius:11px;text-align:left;
  background:transparent;border:1px solid var(--border);color:var(--muted);
  font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:.22s;
}
.sideBtn:hover{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.2)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  height:62px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 18px;
  border-bottom:1px solid var(--border);background:rgba(6,6,6,.6);backdrop-filter:blur(16px);
}
.menuBtn{
  display:none;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.05);
  border:1px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;
}
.topTitle{
  font-weight:700;font-size:15px;letter-spacing:3px;
  background:linear-gradient(135deg,#fff,#888);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.fusionChip{
  display:flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border-radius:20px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.4px;
}
.fusionChip .dots{display:flex;gap:3px}
.fusionChip .dots i{
  width:6px;height:6px;border-radius:50%;background:#fff;display:block;
  animation:dotPulse 2s ease-in-out infinite;
}
.fusionChip .dots i:nth-child(1){animation-delay:0s;opacity:.9}
.fusionChip .dots i:nth-child(2){animation-delay:.15s;opacity:.75}
.fusionChip .dots i:nth-child(3){animation-delay:.3s;opacity:.6}
.fusionChip .dots i:nth-child(4){animation-delay:.45s;opacity:.45}
.fusionChip .dots i:nth-child(5){animation-delay:.6s;opacity:.35}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.5);opacity:1}}
.topSpacer{flex:1}
.statusPill{
  display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;
  font-size:11px;font-weight:600;letter-spacing:.4px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);
}
.dot{width:7px;height:7px;border-radius:50%;background:#ff4d6d}
.dot.on{background:#fff;animation:pulseDot 1.8s infinite}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.iconBtn{
  width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.05);
  border:1px solid var(--border);color:var(--text);font-size:15px;cursor:pointer;transition:.24s;
  display:grid;place-items:center;
}
.iconBtn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);transform:translateY(-1px)}
.iconBtn.active{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4)}

/* messages */
.messages{flex:1;overflow-y:auto;padding:26px 0 12px;scroll-behavior:smooth}
.msgWrap{max-width:820px;margin:0 auto 18px;padding:0 20px;display:flex;gap:12px;
  animation:bubbleIn .45s cubic-bezier(.2,.9,.3,1.3);will-change:transform}
@keyframes bubbleIn{
  0%{opacity:0;transform:translateY(14px) scale(.94)}
  60%{transform:translateY(-2px) scale(1.01)}
  100%{opacity:1;transform:none}
}
.msgWrap.user{flex-direction:row-reverse}
.msgAvatar{
  width:32px;height:32px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;
  font-size:13px;font-weight:800;position:relative;
}
.msgAvatar.ai{
  background:linear-gradient(135deg,#fff,#888);color:#000;
  animation:avatarGlow 3s ease-in-out infinite;
}
@keyframes avatarGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.3)}
  50%{box-shadow:0 0 18px 2px rgba(255,255,255,.4)}
}
.msgAvatar.me{background:rgba(255,255,255,.1);border:1px solid var(--border);color:var(--muted)}
.bubble{
  max-width:min(680px,82%);padding:12px 16px;border-radius:15px;
  font-size:14px;line-height:1.7;word-wrap:break-word;overflow-wrap:anywhere;
  transition:.28s;
}
.msgWrap.ai .bubble{
  background:rgba(255,255,255,.045);border:1px solid var(--border);
  border-top-left-radius:5px;color:#e5e5e5;
}
.msgWrap.ai .bubble:hover{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.07)}
.msgWrap.user .bubble{
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
  border-top-right-radius:5px;color:#fff;
}
.msgWrap.user .bubble:hover{background:rgba(255,255,255,.18)}
.msgMeta{
  font-size:9.5px;color:var(--muted2);margin-top:7px;letter-spacing:.6px;
  display:flex;align-items:center;gap:8px;text-transform:uppercase;font-weight:600;
}
.msgMeta .pills{display:flex;gap:4px}
.msgMeta .pills i{
  font-style:normal;padding:1px 6px;border-radius:8px;font-size:8.5px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#777;
}
.bubble code.inline{
  background:rgba(255,255,255,.1);color:#fff;padding:2px 6px;border-radius:5px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
}
.bubble pre.code{
  position:relative;margin:10px 0;padding:13px 15px;border-radius:11px;overflow-x:auto;
  background:#0a0a0a;border:1px solid rgba(255,255,255,.14);
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.65;color:#d0d0d0;
}
.copyBtn{
  position:absolute;top:8px;right:8px;padding:4px 10px;border-radius:7px;font-size:10.5px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#ccc;
  cursor:pointer;font-family:inherit;transition:.2s;
}
.copyBtn:hover{background:rgba(255,255,255,.22);color:#fff}

/* typing */
.typing{display:flex;gap:6px;padding:18px 20px;align-items:center}
.typing span{
  width:7px;height:7px;border-radius:50%;background:#fff;
  animation:bounce 1.3s infinite ease-in-out;
}
.typing span:nth-child(2){animation-delay:.16s;opacity:.7}
.typing span:nth-child(3){animation-delay:.32s;opacity:.5}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-7px);opacity:1}}
.typingLabel{
  margin-left:10px;font-size:11px;color:var(--muted);letter-spacing:.6px;
  animation:labelFade 2s ease-in-out infinite;
}
@keyframes labelFade{0%,100%{opacity:.5}50%{opacity:1}}

/* welcome */
.welcome{max-width:760px;margin:0 auto;padding:34px 24px;text-align:center;animation:bubbleIn .7s}
.welcome .fusionRing{
  width:90px;height:90px;margin:0 auto 22px;position:relative;
}
.welcome .fusionRing .orbit{
  position:absolute;inset:0;border-radius:50%;border:1.5px dashed rgba(255,255,255,.18);
  animation:spin 18s linear infinite;
}
.welcome .fusionRing .orbit:nth-child(2){inset:12px;animation-duration:12s;animation-direction:reverse;border-style:solid;border-color:rgba(255,255,255,.12)}
.welcome .fusionRing .orbit:nth-child(3){inset:24px;animation-duration:8s;border-color:rgba(255,255,255,.25)}
.welcome .fusionRing .core{
  position:absolute;inset:32px;border-radius:50%;
  background:radial-gradient(circle,#fff,#888);
  box-shadow:0 0 30px rgba(255,255,255,.55);
  animation:corePulse 2.4s ease-in-out infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes corePulse{0%,100%{transform:scale(1);box-shadow:0 0 20px rgba(255,255,255,.4)}50%{transform:scale(1.1);box-shadow:0 0 40px rgba(255,255,255,.7)}}
.welcome h1{
  font-size:clamp(26px,4.6vw,40px);font-weight:800;letter-spacing:-.5px;margin-bottom:10px;
  background:linear-gradient(135deg,#fff 0%,#666 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:logoPulse 3.5s ease-in-out infinite;
}
.welcome p{color:var(--muted);font-size:13.5px;margin-bottom:8px;line-height:1.6}
.welcome .subline{color:var(--muted2);font-size:11.5px;margin-bottom:26px;letter-spacing:.4px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{
  padding:11px 17px;border-radius:12px;font-size:12.5px;cursor:pointer;transition:.3s;
  background:rgba(255,255,255,.045);border:1px solid var(--border);color:#b0b0b0;
  font-family:inherit;font-weight:500;animation:chipIn .6s backwards;
}
.chip:nth-child(1){animation-delay:.1s}
.chip:nth-child(2){animation-delay:.2s}
.chip:nth-child(3){animation-delay:.3s}
.chip:nth-child(4){animation-delay:.4s}
@keyframes chipIn{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
.chip:hover{
  background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.35);color:#fff;
  transform:translateY(-3px);box-shadow:0 10px 28px rgba(255,255,255,.12);
}

/* composer */
.composerArea{padding:10px 20px 18px;flex-shrink:0}
.hintBar{
  max-width:820px;margin:0 auto 8px;height:16px;font-size:11px;color:var(--muted2);
  letter-spacing:.5px;text-align:center;
}
.composer{
  max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:9px;
  padding:9px 9px 9px 14px;border-radius:19px;
  background:rgba(14,14,14,.92);backdrop-filter:blur(18px);
  border:1px solid var(--border);transition:.3s;
}
.composer:focus-within{
  border-color:rgba(255,255,255,.45);
  box-shadow:0 0 0 4px rgba(255,255,255,.06),0 12px 44px rgba(0,0,0,.6);
}
.composer textarea{
  flex:1;resize:none;border:0;outline:none;background:transparent;color:var(--text);
  font-family:inherit;font-size:14px;line-height:1.6;padding:9px 0;max-height:170px;
}
.composer textarea::placeholder{color:var(--muted2)}
.sendBtn{
  width:42px;height:42px;border-radius:13px;flex-shrink:0;border:0;cursor:pointer;
  background:#fff;color:#000;font-size:16px;display:grid;place-items:center;
  transition:.28s;box-shadow:0 6px 22px rgba(255,255,255,.22);
}
.sendBtn:hover{transform:scale(1.07) rotate(-6deg);box-shadow:0 10px 32px rgba(255,255,255,.4)}
.sendBtn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.micBtn{
  width:42px;height:42px;border-radius:13px;flex-shrink:0;cursor:pointer;
  background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);
  font-size:16px;display:grid;place-items:center;transition:.28s;
}
.micBtn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3)}
.micBtn.listening{
  background:rgba(255,255,255,.2);border-color:#fff;color:#fff;
  animation:micPulse 1.4s infinite;
}
@keyframes micPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}
  70%{box-shadow:0 0 0 14px rgba(255,255,255,0)}
}

/* modal */
.modal{
  position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
  background:rgba(0,0,0,.85);backdrop-filter:blur(10px);animation:fadeIn .25s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modalCard{
  width:min(470px,100%);padding:28px;border-radius:22px;
  background:rgba(14,14,14,.98);border:1px solid var(--border);
  box-shadow:0 50px 120px rgba(0,0,0,.95);animation:popIn .4s cubic-bezier(.2,.9,.3,1.3);
}
.modalCard h3{font-size:17px;margin-bottom:6px;color:#fff}
.modalCard .sub{font-size:12.5px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.modalCard label{display:block;font-size:11.5px;color:var(--muted);margin:14px 0 6px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.modalCard input{
  width:100%;padding:12px 14px;border-radius:11px;background:rgba(255,255,255,.05);
  border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13px;outline:none;
  transition:.22s;
}
.modalCard input:focus{border-color:rgba(255,255,255,.5);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.modalRow{display:flex;gap:10px;margin-top:22px}
.modalRow .btn{flex:1;padding:12px}
.btnGhost{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text)}
.btnGhost:hover{background:rgba(255,255,255,.13)}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,90px);
  padding:12px 22px;border-radius:13px;font-size:13px;font-weight:600;z-index:99;
  background:rgba(20,20,20,.98);border:1px solid rgba(255,255,255,.35);color:#fff;
  box-shadow:0 14px 44px rgba(0,0,0,.75);opacity:0;transition:.4s cubic-bezier(.2,.9,.3,1.3);
}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (max-width:900px){
  .sidebar{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);box-shadow:0 0 60px rgba(0,0,0,.85)}
  .sidebar.open{transform:translateX(0)}
  .menuBtn{display:grid;place-items:center}
  .bubble{max-width:88%}
  .fusionChip{display:none}
  .messages{padding-top:16px}
}
@media (max-width:560px){
  .authCard{padding:28px 22px 24px}
  .brandLogo{font-size:28px;letter-spacing:6px}
  .composerArea{padding:8px 10px 14px}
  .msgWrap{padding:0 12px}
  .topTitle{font-size:13px;letter-spacing:2px}
}

<body>

<div class="modal hidden" id="settingsModal">

    <div class="modalRow">
      <button class="btn btnGhost" id="settingsCancel" type="button">Cancel</button>

    </div>

<div class="toast" id="toast"></div>

<script>
/* ============ HELPERS ============ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash(str){let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h)+str.charCodeAt(i);return(h>>>0).toString(36);}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* ============ STORAGE ============ */
const K_USERS='jarvis.users.v3', K_SESSION='jarvis.session.v3';
const db = {
  users:      () => JSON.parse(localStorage.getItem(K_USERS) || '{}'),
  saveUsers:  u  => localStorage.setItem(K_USERS, JSON.stringify(u)),
  session:    () => localStorage.getItem(K_SESSION),
  setSession: e  => e ? localStorage.setItem(K_SESSION, e) : localStorage.removeItem(K_SESSION),
  chats:      e  => JSON.parse(localStorage.getItem('jarvis.chats.'+e) || '[]'),
  saveChats:  (e,c) => localStorage.setItem('jarvis.chats.'+e, JSON.stringify(c)),
  settings:   e  => JSON.parse(localStorage.getItem('jarvis.settings.'+e) || '{}'),
  saveSettings:(e,s) => localStorage.setItem('jarvis.settings.'+e, JSON.stringify(s))
};

let state = { email:null, name:'', chats:[], current:null, voiceOn:true, settings:{} };

/* ============ PARTICLE BG ============ */
(function particles(){
  const cvs = $('#bgCanvas'); const ctx = cvs.getContext('2d');
  let W,H,parts=[];
  function resize(){
    W = cvs.width  = innerWidth;
    H = cvs.height = innerHeight;
    const n = Math.min(85, Math.floor(W*H/19000));
    parts = Array.from({length:n},()=>({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-.5)*.28, vy:(Math.random()-.5)*.28,
      r:Math.random()*1.6+.5, a:Math.random()*.55+.15
    }));
  }
  function loop(){
    ctx.clearRect(0,0,W,H);
    for(const p of parts){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W) p.vx*=-1;
      if(p.y<0||p.y>H) p.vy*=-1;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='#fff'; ctx.globalAlpha=p.a;
      ctx.shadowBlur=8; ctx.shadowColor='#fff';
      ctx.fill();
    }
    ctx.globalAlpha=1; ctx.shadowBlur=0;
    requestAnimationFrame(loop);
  }
  addEventListener('resize', resize);
  resize(); loop();
})();

/* ============ AUTH ============ */
$$('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    $$('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    const isLogin = tab.dataset.tab === 'login';
    $('#loginForm').classList.toggle('hidden', !isLogin);
    $('#signupForm').classList.toggle('hidden', isLogin);
  });
});

function showErr(box, msg, ok=false){
  box.textContent = msg;
  box.className = 'errBox show' + (ok ? ' ok' : '');
  box.style.animation = 'none'; void box.offsetWidth; box.style.animation = '';
}

$('#signupForm').addEventListener('submit', e => {
  e.preventDefault();
  const box   = $('#signupErr');
  const name  = $('#signupName').value.trim();
  const email = $('#signupEmail').value.trim().toLowerCase();
  const pass  = $('#signupPass').value;
  const pass2 = $('#signupPass2').value;

  if(!name || !email || !pass || !pass2) return showErr(box, '⚠️ Please fill in all fields.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return showErr(box, '⚠️ Please enter a valid email address.');
  if(pass.length < 6) return showErr(box, '⚠️ Password must be at least 6 characters long.');
  if(pass !== pass2) return showErr(box, '⚠️ Passwords do not match.');

  const users = db.users();
  if(users[email]) return showErr(box, '🚫 Account already created with this email. Please login instead.');

  users[email] = { name, pass: hash(pass), created: Date.now() };
  db.saveUsers(users);
  showErr(box, '✅ Account created! Loading your fused JARVIS...', true);

  setTimeout(() => { $('#signupForm').reset(); startSession(email); }, 700);
});

$('#loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const box   = $('#loginErr');
  const email = $('#loginEmail').value.trim().toLowerCase();
  const pass  = $('#loginPass').value;

  if(!email || !pass) return showErr(box, '⚠️ Please enter email and password.');

  const users = db.users();
  if(!users[email]) return showErr(box, '🚫 No account found with this email. Please create an account first.');
  if(users[email].pass !== hash(pass)) return showErr(box, '🚫 Incorrect password. Please try again.');

  showErr(box, '✅ Login successful!', true);
  setTimeout(() => { $('#loginForm').reset(); startSession(email); }, 450);
});

/* ============ SESSION ============ */
function startSession(email){
  const users = db.users();
  if(!users[email]) { db.setSession(null); return; }

  state.email = email;
  state.name  = users[email].name;
  db.setSession(email);

  state.settings = db.settings(email);
  state.voiceOn  = state.settings.voiceOn !== false;

  state.chats = db.chats(email);
  if(!state.chats.length) state.chats = [makeChat()];
  state.current = state.chats[0].id;

  $('#userName').textContent   = state.name;
  $('#userEmail').textContent  = email;
  $('#userAvatar').textContent = (state.name[0] || 'U').toUpperCase();
  $('#voiceToggle').classList.toggle('active', state.voiceOn);

  updateStatus();
  $('#authScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  renderChatList(); renderMessages(); $('#input').focus();
}

$('#logoutBtn').addEventListener('click', () => {
  stopListening(); speechSynthesis.cancel();
  db.setSession(null);
  state.email = null;
  $('#app').classList.add('hidden');
  $('#authScreen').classList.remove('hidden');
  $('#sidebar').classList.remove('open');
});

(function autoLogin(){
  const s = db.session();
  if(s && db.users()[s]) startSession(s);
})();

/* ============ CHAT STATE ============ */
function makeChat(){ return { id:'c'+Date.now()+Math.random().toString(36).slice(2,6), title:'New Chat', messages:[] }; }
const currentChat = () => state.chats.find(c => c.id === state.current);
const persist = () => db.saveChats(state.email, state.chats);

$('#newChatBtn').addEventListener('click', () => {
  const c = makeChat();
  state.chats.unshift(c); state.current = c.id;
  persist(); renderChatList(); renderMessages();
  $('#sidebar').classList.remove('open');
  $('#input').focus();
});

$('#menuBtn').addEventListener('click', () => $('#sidebar').classList.toggle('open'));

function updateStatus(){
  const real = !!(state.settings.key && state.settings.url);
  $('#statusText').textContent = real ? 'Fused · Live' : 'Fused · Demo';
  $('#statusDot').classList.add('on');
}

function renderChatList(){
  $('#chatList').innerHTML = state.chats.map(c => `
    <div class="chatItem ${c.id === state.current ? 'active' : ''}" data-id="${c.id}">
      <span>💬 ${esc(c.title)}</span>
      <b class="del" data-del="${c.id}">×</b>
    </div>`).join('');

  $$('.chatItem').forEach(el => {
    el.addEventListener('click', ev => {
      if(ev.target.dataset.del){
        state.chats = state.chats.filter(c => c.id !== ev.target.dataset.del);
        if(!state.chats.length) state.chats = [makeChat()];
        if(!state.chats.find(c => c.id === state.current)) state.current = state.chats[0].id;
        persist(); renderChatList(); renderMessages();
        return;
      }
      state.current = el.dataset.id;
      renderChatList(); renderMessages();
      $('#sidebar').classList.remove('open');
    });
  });
}

/* ============ RENDER ============ */
function md(text){
  const blocks = [];
  let t = String(text).replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    const i = blocks.length;
    blocks.push(`<pre class="code"><button class="copyBtn" onclick="copyCode(this)">Copy</button><code>${esc(code)}</code></pre>`);
    return `\u0000B${i}\u0000`;
  });
  t = esc(t);
  t = t.replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\n/g, '<br>');
  t = t.replace(/\u0000B(\d+)\u0000/g, (_, i) => blocks[+i]);
  return t;
}
window.copyCode = function(btn){
  const code = btn.parentElement.querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1400);
  });
};

function renderMessages(){
  const box = $('#messages');
  const chat = currentChat();
  if(!chat) return;

  if(!chat.messages.length){
    box.innerHTML = `
      <div class="welcome">
        <div class="fusionRing">
          <div class="orbit"></div>
          <div class="orbit"></div>
          <div class="orbit"></div>
          <div class="core"></div>
        </div>
        <h1>Hello, ${esc(state.name.split(' ')[0])} 👋</h1>
        <p>I am JARVIS — a fused intelligence built from GPT, Claude, Grok, DeepSeek &amp; Gemini.</p>
        <div class="subline">ONE assistant · FIVE minds · FUSED for you</div>
        <div class="chips">
          <button class="chip" data-prompt="Explain quantum computing like I'm 10">🧠 Explain quantum computing</button>
          <button class="chip" data-prompt="Write a JavaScript debounce function">⚡ Write JS debounce</button>
          <button class="chip" data-prompt="Give me 5 startup ideas in 2026">🚀 Startup ideas</button>
          <button class="chip" data-prompt="Tell me a witty joke">😏 Tell me a joke</button>
        </div>
      </div>`;
    $$('.chip', box).forEach(c => c.addEventListener('click', () => {
      $('#input').value = c.dataset.prompt;
      send();
    }));
    return;
  }

  box.innerHTML = chat.messages.map(m => {
    const isAI = m.role === 'assistant';
    return `
      <div class="msgWrap ${isAI ? 'ai' : 'user'}">
        <div class="msgAvatar ${isAI ? 'ai' : 'me'}">${isAI ? 'J' : (state.name[0]||'U').toUpperCase()}</div>
        <div>
          <div class="bubble">${md(m.content)}</div>
          ${isAI ? `<div class="msgMeta">
              <span>FUSED</span>
              <div class="pills"><i>GPT</i><i>Claude</i><i>Grok</i><i>DS</i><i>Gemini</i></div>
            </div>` : ''}
        </div>
      </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

/* ============ SEND ============ */
const input = $('#input');
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 170) + 'px';
});
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
$('#sendBtn').addEventListener('click', send);

let busy = false;

async function send(){
  const text = input.value.trim();
  if(!text || busy) return;

  const chat = currentChat();
  if(!chat) return;

  busy = true;
  input.value = ''; input.style.height = 'auto';
  $('#sendBtn').disabled = true;

  chat.messages.push({ role:'user', content:text });
  if(chat.title === 'New Chat') chat.title = text.slice(0, 34) + (text.length > 34 ? '…' : '');
  persist(); renderChatList(); renderMessages();

  const box = $('#messages');
  const typing = document.createElement('div');
  typing.className = 'msgWrap ai';
  typing.innerHTML = `
    <div class="msgAvatar ai">J</div>
    <div class="bubble" style="padding:0;background:transparent;border:0">
      <div class="typing">
        <span></span><span></span><span></span>
        <span class="typingLabel" id="typingLabel">Fusing 5 models...</span>
      </div>
    </div>`;
  box.appendChild(typing);
  box.scrollTop = box.scrollHeight;

  // cycle fusion labels
  const labels = ['GPT analyzing...','Claude reasoning...','Grok checking...','DeepSeek computing...','Gemini creating...','Fusing intelligence...'];
  let li = 0;
  const cycle = setInterval(() => {
    const el = $('#typingLabel');
    if(el){ el.textContent = labels[li % labels.length]; li++; }
  }, 420);

  let reply;
  try { reply = await getReply(text, chat.messages); }
  catch(err){ reply = "⚠️ Something went wrong: " + err.message; }

  clearInterval(cycle);
  typing.remove();
  chat.messages.push({ role:'assistant', content:reply });
  persist(); renderMessages();

  if(state.voiceOn) speak(reply);

  busy = false;
  $('#sendBtn').disabled = false;
  input.focus();
}

/* ============ FUSED AI ENGINE ============ */
async function getReply(text, history){
  const s = state.settings;
  if(s.key && s.url){
    try {
      const res = await fetch(s.url, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + s.key },
        body: JSON.stringify({
          model: s.model || 'gpt-4o-mini',
          messages: [
            { role:'system', content:'You are JARVIS, a fused AI combining the strengths of GPT (precision), Claude (reasoning), Grok (wit), DeepSeek (technical depth), and Gemini (creativity). Answer in a unified, confident voice.' },
            ...history.map(m => ({ role:m.role, content:m.content }))
          ]
        })
      });
      if(!res.ok) throw new Error('API ' + res.status);
      const data = await res.json();
      return data.choices?.[0]?.message?.content || '(empty response)';
    } catch(e){
      return "⚠️ API error: " + e.message + "\n\nFalling back to fusion brain:\n\n" + demoReply(text);
    }
  }
  await sleep(700 + Math.random() * 800);
  return demoReply(text);
}

/* Fused demo brain — combines all 5 model strengths */
function demoReply(text){
  const t = text.toLowerCase().trim();
  const raw = text;

  // Greeting
  if(/^(hi|hello|hey|yo|sup|hola|namaste|good (morning|evening|night))\b/.test(t)){
    return `Hello. I'm **JARVIS** — a fused intelligence.\n\n` +
      `I combine five AI minds into one:\n` +
      `• **GPT** — precision & structure\n` +
      `• **Claude** — careful reasoning\n` +
      `• **Grok** — wit & honesty\n` +
      `• **DeepSeek** — technical depth\n` +
      `• **Gemini** — creativity & connections\n\n` +
      `Ask me anything — code, math, ideas, explanations — and I'll fuse the best of all five.`;
  }

  // Who are you
  if(/who are you|what are you|your name|introduce/.test(t)){
    return `I'm **JARVIS**.\n\n` +
      `Not five separate assistants — **one fused intelligence**. When you ask me something, the strengths of GPT, Claude, Grok, DeepSeek, and Gemini all activate together and collapse into a single answer.\n\n` +
      `Think of it as a hive mind that speaks as one voice.`;
  }

  // Code
  if(/code|function|javascript|python|debounce|program|api|async/.test(t)){
    return `Here's a clean, production-ready implementation.\n\n` +
`\`\`\`js
function debounce(fn, delay = 300) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
}

// usage
const onSearch = debounce(q => console.log(q), 400);
input.addEventListener('input', e => onSearch(e.target.value));
\`\`\`\n\n` +
      `**Why this works:**\n` +
      `• Every keystroke cancels the previous timer\n` +
      `• Only the final call fires after \`delay\` ms of silence\n` +
      `• Prevents API spam and keeps the UI responsive\n\n` +
      `Want it as a \`requestAnimationFrame\` throttle instead? Just ask.`;
  }

  // Math
  const mathMatch = t.match(/(-?\d+(?:\.\d+)?)\s*([+\-*/x])\s*(-?\d+(?:\.\d+)?)/);
  if(mathMatch){
    const a = +mathMatch[1], b = +mathMatch[3];
    const op = mathMatch[2] === 'x' ? '*' : mathMatch[2];
    const r = op==='+'?a+b:op==='-'?a-b:op==='*'?a*b:(b===0?'undefined':a/b);
    return `**${a} ${op} ${b} = ${r}**\n\n` +
      `Computed by DeepSeek-grade math, verified by Claude-grade reasoning. ✅`;
  }

  // Time
  if(/time|date|day|today/.test(t)){
    return `Right now: **${new Date().toLocaleString()}**\n\n` +
      `(Synced across all 5 fusion minds — no drift, no conflict.)`;
  }

  // Joke
  if(/joke|funny|laugh|humor/.test(t)){
    return `Here's one, delivered with **Grok's wit** and **Gemini's charm**:\n\n` +
      `> A SQL query walks into a bar, sees two tables, and asks:\n` +
      `> *"May I JOIN you?"* 🍸\n\n` +
      `**Claude** would call that a relational pun. **GPT** confirms the schema is valid. **DeepSeek** notes the O(1) lookup. 😄`;
  }

  // Startup
  if(/idea|startup|business|product|launch/.test(t)){
    return `**Five fused startup ideas for 2026** — GPT-structured, Gemini-inspired, DeepSeek-validated:\n\n` +
      `1. **Local-first AI** — private on-device assistants for healthcare & finance\n` +
      `2. **Voice dev tools** — natural-language coding in the terminal\n` +
      `3. **AI energy audits** — optimize data-center workloads in real time\n` +
      `4. **Personal knowledge graph** — unify notes, mail, chats into one memory\n` +
      `5. **Verifiable AI** — cryptographic proof of model behavior for compliance\n\n` +
      `**Claude's note:** #3 has the clearest path to revenue. **Grok's note:** #2 is the most fun to build.\n\n` +
      `Want a full business model for any of these?`;
  }

  // Explain
  if(/explain|what is|what's|how does|define|why/.test(t)){
    const topic = raw.replace(/^(explain|what is|what's|how does|define|why)\s*/i, '').replace(/[?.!]+$/, '') || 'it';
    return `**${esc(topic.charAt(0).toUpperCase() + topic.slice(1))}** — fused explanation:\n\n` +
      `• **Core idea** (GPT) — the essential concept, stripped to its cleanest form\n` +
      `• **Why it matters** (Claude) — real-world impact and ethical weight\n` +
      `• **How it works** (DeepSeek) — the mechanism, step by step, no hand-waving\n` +
      `• **Analogy** (Gemini) — a familiar mental model so it clicks instantly\n` +
      `• **Shortcut** (Grok) — the blunt truth you actually need to remember\n\n` +
      `Ask a follow-up and I'll go deeper on any single layer.`;
  }

  // Fallback — confident fused answer
  return `Let's take that apart together.\n\n` +
    `**Your question:** *"${esc(raw.slice(0, 110))}"*\n\n` +
    `Here's how the five minds would fuse on it:\n\n` +
    `• **GPT** would frame it clearly and structured\n` +
    `• **Claude** would weigh nuance and honesty\n` +
    `• **Grok** would cut straight to what matters\n` +
    `• **DeepSeek** would verify the technical core\n` +
    `• **Gemini** would connect it to something unexpected\n\n` +
    `The fused verdict: this is the kind of question that benefits from **asking one specific follow-up**. Try narrowing it — what's the exact outcome you want? I'll deliver a sharper fused answer.\n\n` +
    `*(Demo mode active. Paste an API key in Settings to unlock live fusion.)*`;
}

/* ============ VOICE ============ */
$('#voiceToggle').addEventListener('click', () => {
  state.voiceOn = !state.voiceOn;
  state.settings.voiceOn = state.voiceOn;
  db.saveSettings(state.email, state.settings);
  $('#voiceToggle').classList.toggle('active', state.voiceOn);
  if(!state.voiceOn) speechSynthesis.cancel();
  toast(state.voiceOn ? '🔊 Voice on' : '🔇 Voice off');
});

function speak(text){
  if(!state.voiceOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const clean = text.replace(/```[\s\S]*?```/g, 'code block').replace(/[#*`_>•]/g,'').slice(0, 320);
  const u = new SpeechSynthesisUtterance(clean);
  u.rate = 1.02; u.pitch = 1.0; u.volume = 1;
  const voices = speechSynthesis.getVoices();
  const pref = voices.find(v => /Google UK English Male|Daniel|Alex/i.test(v.name)) || voices[0];
  if(pref) u.voice = pref;
  speechSynthesis.speak(u);
}

let recognition = null, listening = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

if(SR){
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onresult = e => {
    let finalText = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      if(e.results[i].isFinal) finalText += e.results[i][0].transcript;
    }
    if(finalText){
      const low = finalText.toLowerCase();
      if(/^(jarvis|hey jarvis|ok jarvis)[, ]*/i.test(low)){
        const rest = finalText.replace(/^(jarvis|hey jarvis|ok jarvis)[, ]*/i,'').trim();
        if(rest){ input.value = rest; send(); }
        else toast('🎤 Yes? I\'m listening...');
      }
    }
  };
  recognition.onerror = () => {};
  recognition.onend = () => { if(listening){ try{ recognition.start(); }catch(_){} } };
}

$('#micBtn').addEventListener('click', () => {
  if(!SR){ toast('❌ Voice not supported in this browser'); return; }
  if(listening) stopListening(); else startListening();
});

function startListening(){
  try{
    recognition.start();
    listening = true;
    $('#micBtn').classList.add('listening');
    $('#hintBar').textContent = '🎤 Listening... say "Jarvis" followed by your question';
  }catch(_){}
}
function stopListening(){
  listening = false;
  $('#micBtn').classList.remove('listening');
  $('#hintBar').textContent = '';
  try{ recognition && recognition.stop(); }catch(_){}
}

/* ============ SETTINGS ============ */
$('#settingsBtn').addEventListener('click', () => {
  const s = state.settings;
  $('#setUrl').value   = s.url || '';
  $('#setKey').value   = s.key || '';
  $('#setModel').value = s.model || '';
  $('#settingsModal').classList.remove('hidden');
});
$('#settingsCancel').addEventListener('click', () => $('#settingsModal').classList.add('hidden'));
$('#settingsSave').addEventListener('click', () => {
  state.settings.url   = $('#setUrl').value.trim();
  state.settings.key   = $('#setKey').value.trim();
  state.settings.model = $('#setModel').value.trim();
  db.saveSettings(state.email, state.settings);
  $('#settingsModal').classList.add('hidden');
  updateStatus();
  toast('✅ Settings saved');
});

/* ============ KEYBOARD ============ */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') $('#settingsModal').classList.add('hidden');
  if((e.ctrlKey || e.metaKey) && e.key === 'k'){ e.preventDefault(); input.focus(); }
});

if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = () => {};
  speechSynthesis.getVoices();
}
</script>
