<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Live Assistant</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --primary: #00f3ff;
            --bg: #010a17;
            --pulse-scale: 1;
            --status-color: #00f3ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at center, #021a33 0%, #000000 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            color: var(--primary);
        }

        .hud-container {
            position: relative;
            width: 80vmin;
            height: 80vmin;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .core {
            position: absolute;
            width: 35vmin;
            height: 35vmin;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 243, 255, 0.05);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2), inset 0 0 30px rgba(0, 243, 255, 0.2);
            border: 2px solid rgba(0, 243, 255, 0.5);
            transform: scale(var(--pulse-scale));
            transition: transform 0.05s ease-out, box-shadow 0.3s;
            z-index: 10;
        }

        .core-text {
            font-size: 3vmin;
            font-weight: bold;
            letter-spacing: 0.5vmin;
            text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
            text-align: center;
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid transparent;
        }

        .ring-1 {
            width: 70vmin; height: 70vmin;
            border-top: 2px solid var(--primary);
            border-bottom: 2px solid var(--primary);
            border-left: 1px dashed rgba(0, 243, 255, 0.3);
            border-right: 1px dashed rgba(0, 243, 255, 0.3);
            animation: spin 15s linear infinite;
        }

        .ring-2 {
            width: 60vmin; height: 60vmin;
            border-left: 4px solid var(--primary);
            border-right: 4px solid var(--primary);
            animation: reverse-spin 10s linear infinite;
        }

        .ring-3 {
            width: 55vmin; height: 55vmin;
            border: 2px solid transparent;
            background: repeating-conic-gradient(from 0deg, var(--primary) 0deg 1deg, transparent 1deg 10deg);
            -webkit-mask-image: radial-gradient(transparent 67%, black 68%, black 70%, transparent 71%);
            mask-image: radial-gradient(transparent 67%, black 68%, black 70%, transparent 71%);
            animation: spin 25s linear infinite reverse;
            opacity: 0.7;
        }

        .ring-4 {
            width: 45vmin; height: 45vmin;
            border-top: 3px dashed var(--primary);
            border-bottom: 3px dashed var(--primary);
            animation: spin 8s linear infinite;
            opacity: 0.5;
        }

        .scanner {
            position: absolute;
            width: 80vmin; height: 80vmin;
            border-radius: 50%;
            background: linear-gradient(to bottom, transparent 45%, rgba(0, 243, 255, 0.2) 50%, transparent 55%);
            animation: spin 4s linear infinite;
            pointer-events: none;
            z-index: 5;
        }

        .status-text {
            position: absolute;
            bottom: -8vmin;
            font-size: 2vmin;
            color: var(--status-color);
            text-shadow: 0 0 10px var(--status-color);
            letter-spacing: 2px;
            text-align: center;
            width: 100%;
            transition: color 0.3s;
        }

        .hud-text {
            position: absolute;
            font-size: 1.5vmin;
            opacity: 0.6;
            letter-spacing: 2px;
        }
        .top-left { top: 5%; left: 5%; }
        .top-right { top: 5%; right: 5%; text-align: right; }
        .bottom-left { bottom: 5%; left: 5%; }
        .bottom-right { bottom: 5%; right: 5%; text-align: right; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes reverse-spin { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }

        .transcript-box {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 80vw;
            max-width: 800px;
            height: 15vh;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 10px;
            font-size: 1.5vmin;
            overflow-y: auto;
            color: #fff;
            border-radius: 5px;
            display: none;
        }

        .transcript-box.active { display: block; }
        .user-text { color: #00ff88; margin-bottom: 5px; }
        .ai-text { color: #00f3ff; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="hud-container">
        <div class="hud-text top-left">SYSTEM: ONLINE<br>WAKE WORD: "JARVIS"</div>
        <div class="hud-text top-right">NETWORK: SECURE<br>LATENCY: 12ms</div>
        <div class="hud-text bottom-left">MIC: <span id="mic-status">STANDBY</span></div>
        <div class="hud-text bottom-right">MODE: LIVE<br>AI: CONNECTED</div>

        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <div class="ring ring-4"></div>
        
        <div class="scanner"></div>

        <div class="core" id="core">
            <div class="core-text" id="core-text">J.A.R.V.I.S</div>
        </div>

        <div class="status-text" id="status-text">Say "JARVIS" to activate...</div>
    </div>

    <div class="transcript-box" id="transcript-box"></div>

    <script>
        // --- UI Elements ---
        const core = document.getElementById('core');
        const coreText = document.getElementById('core-text');
        const statusText = document.getElementById('status-text');
        const micStatus = document.getElementById('mic-status');
        const transcriptBox = document.getElementById('transcript-box');

        // --- State Management ---
        let isListening = false;
        let isProcessing = false;
        let isSpeaking = false;
        let audioContext;
        let analyser;
        let dataArray;
        let animationFrameId;

        // --- Web Speech API Setup ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Your browser does not support the Web Speech API. Please use Google Chrome or Microsoft Edge.");
        }

        const recognition = new SpeechRecognition();
        recognition.continuous = true; // Keep listening for wake word
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        // --- Text-to-Speech Setup ---
        const synth = window.speechSynthesis;
        let jarvisVoice = null;

        // Load voices and try to find a British Male voice for JARVIS
        function loadVoices() {
            const voices = synth.getVoices();
            // Try to find a deep, British voice (like Daniel or George)
            jarvisVoice = voices.find(v => v.lang === 'en-GB' && v.name.includes('Male')) ||
                          voices.find(v => v.name.includes('Daniel')) ||
                          voices.find(v => v.lang === 'en-GB') ||
                          voices[0];
        }
        synth.onvoiceschanged = loadVoices;
        loadVoices();

        // --- Audio Visualizer Logic (Reusing previous code) ---
        async function setupAudioVisualizer() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                updateAudioVisualizer();
            } catch (err) {
                console.error("Mic access denied for visualizer:", err);
            }
        }

        function updateAudioVisualizer() {
            if (!analyser) return;
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let average = sum / dataArray.length;
            let scale = 1 + (average / 60); 
            document.documentElement.style.setProperty('--pulse-scale', scale);
            let glowIntensity = Math.min(50, average * 0.5);
            core.style.boxShadow = `0 0 ${20 + glowIntensity}px rgba(0, 243, 255, 0.6), inset 0 0 ${30 + glowIntensity}px rgba(0, 243, 255, 0.4)`;
            animationFrameId = requestAnimationFrame(updateAudioVisualizer);
        }

        // --- Core Assistant Logic ---

        // 1. Start the hands-free loop
        function startAssistant() {
            if (isListening) return;
            isListening = true;
            recognition.start();
            setupAudioVisualizer();
            micStatus.textContent = "ACTIVE";
            statusText.textContent = "Listening for 'JARVIS'...";
            statusText.style.color = "#00ff88";
        }

        // 2. Handle Speech Recognition Results
        recognition.onresult = (event) => {
            if (isProcessing || isSpeaking) return; // Ignore while AI is thinking/speaking to prevent echo

            const last = event.results.length - 1;
            const transcript = event.results[last][0].transcript.toLowerCase().trim();
            const isFinal = event.results[last].isFinal;

            // Wake Word Detection
            if (transcript.includes("jarvis")) {
                // Check if there is a command after the wake word
                const commandText = transcript.replace("jarvis", "").trim();
                
                if (commandText.length > 0 && isFinal) {
                    // Command given directly with wake word
                    addToTranscript('user', commandText);
                    processUserCommand(commandText);
                } else if (isFinal) {
                    // Just the wake word said
                    statusText.textContent = "Yes, sir? I'm listening...";
                    statusText.style.color = "#00f3ff";
                    speakResponse("Yes, sir? How can I help you?");
                }
            } else if (isFinal && transcript.length > 0) {
                // If listening was manually triggered or already active
                // Here we assume if it hears a command after activation, it processes it.
                // For simplicity, let's just process any final sentence when the mic is active.
                // In a real app, you'd use a state machine to track if the assistant is "awaiting command".
            }
        };

        recognition.onerror = (event) => {
            console.error("Speech recognition error:", event.error);
            if (event.error === 'not-allowed') {
                statusText.textContent = "Microphone access denied.";
                statusText.style.color = "#ff4444";
            }
        };

        recognition.onend = () => {
            // Automatically restart listening if it stops (e.g., due to silence)
            // unless the AI is currently speaking or processing.
            if (isListening && !isSpeaking && !isProcessing) {
                recognition.start();
            }
        };

        // 3. Process the command (LLM Integration)
        async function processUserCommand(text) {
            isProcessing = true;
            statusText.textContent = "Thinking...";
            statusText.style.color = "#ffaa00";
            coreText.textContent = "THINKING...";

            try {
                // ---------------------------------------------------------
                // OPTION A: MOCK AI (Use this if you don't have an API key)
                // ---------------------------------------------------------
                // await new Promise(resolve => setTimeout(resolve, 1500));
                // const aiResponse = `I heard you say: "${text}". This is a mock response.`;
                
                // ---------------------------------------------------------
                // OPTION B: REAL OpenAI API (Requires a secure backend)
                // ---------------------------------------------------------
                // IMPORTANT: Never expose your API key in frontend code.
                // You must create a backend endpoint (e.g., /api/chat) that
                // uses your API key and returns the response.
                // ---------------------------------------------------------
                const response = await fetch('/api/chat', { // Replace with your actual backend endpoint
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) throw new Error("API request failed");
                const data = await response.json();
                const aiResponse = data.reply; // Assuming your backend returns { reply: "..." }

                // Display and speak the response
                addToTranscript('ai', aiResponse);
                speakResponse(aiResponse);

            } catch (error) {
                console.error("Error processing command:", error);
                const errorMsg = "I'm sorry, I encountered an error connecting to the AI brain.";
                addToTranscript('ai', errorMsg);
                speakResponse(errorMsg);
            } finally {
                isProcessing = false;
            }
        }

        // 4. Text-to-Speech (JARVIS Voice)
        function speakResponse(text) {
            if (synth.speaking) synth.cancel(); // Stop any current speech

            isSpeaking = true;
            statusText.textContent = "Speaking...";
            statusText.style.color = "#00ff88";
            coreText.textContent = "J.A.R.V.I.S";

            const utterance = new SpeechSynthesisUtterance(text);
            if (jarvisVoice) utterance.voice = jarvisVoice;
            utterance.rate = 1.05; // Slightly faster
            utterance.pitch = 0.9; // Slightly lower pitch for JARVIS feel
            
            utterance.onend = () => {
                isSpeaking = false;
                statusText.textContent = "Listening for 'JARVIS'...";
                statusText.style.color = "#00ff88";
                // Recognition might have stopped while speaking, ensure it restarts
                if (isListening && !recognition.active) {
                    try { recognition.start(); } catch(e) {}
                }
            };

            synth.speak(utterance);
        }

        // 5. Transcript Helper
        function addToTranscript(role, text) {
            transcriptBox.classList.add('active');
            const div = document.createElement('div');
            div.className = role === 'user' ? 'user-text' : 'ai-text';
            div.textContent = `${role === 'user' ? 'YOU' : 'JARVIS'}: ${text}`;
            transcriptBox.appendChild(div);
            transcriptBox.scrollTop = transcriptBox.scrollHeight;
            // Keep transcript clean
            if (transcriptBox.children.length > 10) {
                transcriptBox.removeChild(transcriptBox.firstChild);
            }
        }

        // --- Initialization ---
        // Start the assistant automatically on page load
        window.addEventListener('load', () => {
            // Note: Browsers often require a user gesture (click) to start microphone access.
            // If it doesn't start automatically, add a click listener to the body.
            document.body.addEventListener('click', () => {
                if (!isListening) {
                    startAssistant();
                }
            }, { once: true });
            
            // Try to start immediately (might be blocked by browser policy)
            startAssistant();
        });

    </script>
</body>
</html>
