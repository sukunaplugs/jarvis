<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S - Monochrome Assistant</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            /* Monochrome Theme */
            --white: #ffffff;
            --gray-light: #cccccc;
            --gray-mid: #888888;
            --gray-dark: #333333;
            
            --bg-dark: #000000;
            --bg-panel: rgba(20, 20, 20, 0.85);
            --glass-border: rgba(255, 255, 255, 0.2);
            
            --accent: #ffffff;
            --speaking-color: #aaaaaa;
            --text-main: #ffffff;
            --text-muted: #999999;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            height: 100vh;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Monochrome Background Gradients */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 60% 40%, rgba(255, 255, 255, 0.05) 0%, transparent 60%),
                        radial-gradient(circle at 40% 60%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
            animation: bg-pulse 10s infinite alternate;
        }

        @keyframes bg-pulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* --- START SCREEN --- */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
        }
        #start-screen.hidden { opacity: 0; pointer-events: none; }
        .start-title { font-family: 'Orbitron', sans-serif; font-size: 3rem; color: var(--white); text-shadow: 0 0 20px rgba(255,255,255,0.5); margin-bottom: 20px; letter-spacing: 10px; }
        .start-btn { background: transparent; border: 2px solid var(--white); color: var(--white); padding: 15px 40px; font-family: 'Orbitron', sans-serif; font-size: 1.2rem; cursor: pointer; border-radius: 8px; box-shadow: 0 0 20px rgba(255, 255, 255, 0.1); transition: all 0.3s ease; }
        .start-btn:hover { background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 40px rgba(255, 255, 255, 0.4); transform: scale(1.05); }

        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 10; width: 100%; max-width: 1200px; margin: 0 auto; }

        /* --- HUD (Monochrome) --- */
        .hud-wrapper {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 75vmin; height: 75vmin; max-width: 800px; max-height: 800px;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; z-index: 0; opacity: 0.15; transition: all 0.3s ease;
        }
        .hud-wrapper.listening { opacity: 0.6; filter: drop-shadow(0 0 40px var(--white)); }
        .hud-wrapper.speaking { opacity: 0.6; filter: drop-shadow(0 0 40px var(--gray-mid)); }
        .hud-wrapper::after { content: ''; position: absolute; width: 100%; height: 2px; background: rgba(255, 255, 255, 0.4); box-shadow: 0 0 20px var(--white); border-radius: 50%; animation: scan 3s linear infinite; opacity: 0.5; }
        @keyframes scan { 0% { top: 5%; opacity: 0; transform: scaleX(0.8); } 10% { opacity: 1; transform: scaleX(1); } 90% { opacity: 1; transform: scaleX(1); } 100% { top: 95%; opacity: 0; transform: scaleX(0.8); } }

        svg.hud-svg { width: 100%; height: 100%; overflow: visible; }
        .spin-slow { transform-origin: center; animation: rotate 60s linear infinite; }
        .spin-reverse { transform-origin: center; animation: rotate-reverse 40s linear infinite; }
        .spin-fast { transform-origin: center; animation: rotate 15s linear infinite; }
        .spin-reactor { transform-origin: center; animation: rotate 8s linear infinite; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        @keyframes rotate-reverse { 100% { transform: rotate(-360deg); } }

        .logo-text { position: absolute; font-family: 'Orbitron', sans-serif; font-size: clamp(1.5rem, 4vmin, 3rem); font-weight: 900; letter-spacing: 8px; color: var(--white); text-shadow: 0 0 15px rgba(255,255,255,0.6); z-index: 5; transition: all 0.3s ease; text-align: center; }
        .listening .logo-text { color: var(--accent); text-shadow: 0 0 25px var(--white); }
        .speaking .logo-text { color: var(--gray-light); text-shadow: 0 0 20px var(--gray-mid); }

        .reactor-core { position: absolute; width: 40px; height: 40px; background: radial-gradient(circle, #ffffff 0%, #aaaaaa 40%, transparent 70%); border-radius: 50%; box-shadow: 0 0 30px var(--white), 0 0 60px var(--gray-mid); animation: pulse-reactor 2s infinite alternate; margin-top: -120px; }
        @keyframes pulse-reactor { 0% { transform: scale(0.9); box-shadow: 0 0 20px var(--gray-mid); } 100% { transform: scale(1.1); box-shadow: 0 0 50px var(--white), 0 0 80px var(--gray-mid); } }
        .listening .reactor-core { background: radial-gradient(circle, #ffffff 0%, var(--white) 40%, transparent 70%); box-shadow: 0 0 40px var(--white); }
        .speaking .reactor-core { background: radial-gradient(circle, #ffffff 0%, var(--gray-mid) 40%, transparent 70%); box-shadow: 0 0 30px var(--gray-mid); }

        /* --- CHAT (Monochrome) --- */
        .chat-container { flex: 1; overflow-y: auto; padding: 30px 10% 100px 10%; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; z-index: 10; position: relative; }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 6px; }

        .message { display: flex; gap: 15px; max-width: 100%; animation: fadeIn 0.3s ease; }
        .msg-avatar { width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center; flex-shrink: 0; font-family: 'Orbitron', sans-serif; font-weight: bold; font-size: 0.8rem; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        .user-msg { flex-direction: row-reverse; }
        .user-msg .msg-avatar { background: var(--gray-dark); color: var(--white); border: 1px solid var(--gray-mid); }
        .user-msg .msg-content { background: #222222; padding: 12px 18px; border-radius: 12px 12px 0 12px; max-width: 80%; line-height: 1.5; border: 1px solid #444; color: #fff; }
        
        .ai-msg .msg-avatar { background: #111111; border: 1px solid var(--white); color: var(--white); box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .ai-msg .msg-content { background: var(--bg-panel); backdrop-filter: blur(15px); padding: 18px; border-radius: 12px; max-width: 90%; line-height: 1.6; color: var(--text-main); overflow-x: auto; border: 1px solid var(--glass-border); box-shadow: 0 8px 32px rgba(0,0,0,0.8); }
        
        .msg-content p { margin-bottom: 10px; }
        .msg-content p:last-child { margin-bottom: 0; }
        .msg-content pre { background: #0a0a0a; border: 1px solid #333; border-radius: 8px; padding: 12px; margin: 10px 0; overflow-x: auto; }
        .msg-content code { font-family: 'Share Tech Mono', monospace; font-size: 0.9rem; background: rgba(255,255,255,0.1); padding: 2px 5px; border-radius: 4px; color: #fff; }
        .msg-content pre code { background: transparent; padding: 0; color: #d4d4d4; }

        .typing-indicator { display: none; color: var(--gray-light); font-size: 0.9rem; font-family: 'Share Tech Mono', monospace; margin-bottom: 20px; padding-left: 10%; z-index: 10; position: relative; }
        .typing-indicator.active { display: block; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* --- INPUT & DEBUG BOX --- */
        .input-container { position: fixed; bottom: 0; width: 100%; max-width: 1200px; padding: 20px 10%; background: linear-gradient(to top, var(--bg-dark) 80%, transparent); z-index: 10; left: 50%; transform: translateX(-50%); }
        
        #live-transcript { font-family: 'Share Tech Mono', monospace; color: var(--white); font-size: 0.9rem; margin-bottom: 10px; min-height: 20px; text-align: center; text-shadow: 0 0 10px rgba(255,255,255,0.5); opacity: 0.8; transition: opacity 0.3s; }

        .input-box { background: var(--bg-panel); border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(20px); }
        .input-box:focus-within { border-color: var(--white); box-shadow: 0 0 20px rgba(255,255,255,0.1); }
        
        textarea { width: 100%; background: transparent; border: none; color: white; font-family: 'Inter', sans-serif; font-size: 1rem; resize: none; outline: none; max-height: 200px; min-height: 24px; line-height: 1.5; }
        textarea::placeholder { color: var(--gray-mid); }
        
        .input-actions { display: flex; justify-content: space-between; align-items: center; }
        
        .send-btn { background: var(--white); color: black; border: none; width: 38px; height: 38px; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.2s; box-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .send-btn:hover { background: var(--gray-light); box-shadow: 0 0 20px rgba(255,255,255,0.5); transform: scale(1.05); }

        .lang-select { background: transparent; border: 1px solid var(--gray-dark); color: var(--gray-light); border-radius: 8px; padding: 8px 12px; outline: none; font-size: 0.8rem; cursor: pointer; }
        .lang-select option { background: var(--bg-dark); color: white; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="start-screen">
        <div class="start-title">J.A.R.V.I.S</div>
        <button class="start-btn" onclick="window.jarvisObj.startSystem()">INITIALIZE SYSTEM</button>
        <p style="margin-top: 20px; color: #666; font-size: 0.9rem; text-align: center; max-width: 400px;">Note: You must allow microphone permissions in your browser for voice chat to work.</p>
    </div>

    <div class="main-content">
        
        <div class="hud-wrapper" id="mainHud">
            <svg class="hud-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="5" result="blur" />
                        <feMerge><feMergeNode in="blur" /><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
                    </filter>
                    <mask id="top-mask"><rect x="0" y="0" width="800" height="400" fill="white" /></mask>
                    <mask id="bottom-mask"><rect x="0" y="400" width="800" height="400" fill="white" /></mask>
                    <mask id="left-mask"><rect x="0" y="0" width="400" height="800" fill="white" /></mask>
                    <mask id="right-mask"><rect x="400" y="0" width="400" height="800" fill="white" /></mask>
                </defs>
                <!-- Monochrome HUD Rings -->
                <circle cx="400" cy="400" r="380" stroke="var(--white)" stroke-width="2" fill="none" stroke-dasharray="4 12" opacity="0.3" class="spin-slow" />
                <circle cx="400" cy="400" r="360" stroke="var(--white)" stroke-width="4" fill="none" stroke-dasharray="150 100 20 50 200 80 50 150" filter="url(#glow)" class="spin-reverse" />
                <circle cx="400" cy="400" r="330" stroke="var(--white)" stroke-width="8" fill="none" stroke-dasharray="80 200 50 100 150 200" opacity="0.5" class="spin-fast" />
                <circle cx="400" cy="400" r="280" stroke="var(--white)" stroke-width="15" fill="none" stroke-dasharray="2 10" opacity="0.6" mask="url(#top-mask)" />
                <circle cx="400" cy="400" r="260" stroke="var(--white)" stroke-width="3" fill="none" stroke-dasharray="250 1000" transform="rotate(-90 400 400)" opacity="0.8" />
                <circle cx="400" cy="400" r="240" stroke="var(--white)" stroke-width="30" fill="none" stroke-dasharray="4 10" mask="url(#left-mask)" filter="url(#glow)" opacity="0.7" />
                <circle cx="400" cy="400" r="240" stroke="var(--gray-mid)" stroke-width="30" fill="none" stroke-dasharray="2 12" mask="url(#left-mask)" opacity="0.2" />
                <circle cx="400" cy="400" r="240" stroke="var(--white)" stroke-width="10" fill="none" stroke-dasharray="6 20" mask="url(#right-mask)" opacity="0.6" />
                <circle cx="400" cy="400" r="200" stroke="var(--white)" stroke-width="8" fill="none" stroke-dasharray="2 15" mask="url(#bottom-mask)" opacity="0.5" />
                <circle cx="400" cy="400" r="170" stroke="var(--white)" stroke-width="6" fill="none" filter="url(#glow)" class="spin-reactor" stroke-dasharray="120 30 60 30" />
                <circle cx="400" cy="400" r="150" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" fill="none" />
                <circle cx="400" cy="400" r="140" fill="rgba(0, 0, 0, 0.8)" />
            </svg>
            <div class="logo-text">J.A.R.V.I.S</div>
            <div class="reactor-core"></div>
        </div>

        <div class="chat-container" id="chatContainer"></div>
        <div class="typing-indicator" id="typingIndicator">J.A.R.V.I.S is processing...</div>

        <div class="input-container">
            <div id="live-transcript">System offline. Click initialize.</div>

            <div class="input-box">
                <textarea id="chatInput" rows="1" placeholder="Say 'Jarvis' to wake..." oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
                <div class="input-actions">
                    <div class="left-actions">
                        <select class="lang-select" id="langSelect" title="Select Language"></select>
                    </div>
                    <div class="right-actions">
                        <button class="send-btn" id="sendBtn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class JarvisGPT {
            constructor() {
                this.chatContainer = document.getElementById('chatContainer');
                this.chatInput = document.getElementById('chatInput');
                this.sendBtn = document.getElementById('sendBtn');
                this.langSelect = document.getElementById('langSelect');
                this.typingIndicator = document.getElementById('typingIndicator');
                this.mainHud = document.getElementById('mainHud');
                this.liveTranscript = document.getElementById('live-transcript');
                
                this.messages = [];
                this.isListening = false;
                this.isSpeaking = false;
                this.isProcessing = false;
                this.currentLang = 'en-US';
                this.voices = [];
                this.recognition = null;
                this.micWatchdog = null;

                this.init();
            }

            init() {
                this.loadVoices();
                this.setupSpeechRecognition();
                this.setupEventListeners();
            }

            async startSystem() {
                document.getElementById('start-screen').classList.add('hidden');
                this.addMessage('ai', 'Systems online. Neural link established. I am listening, sir.');
                
                try {
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                } catch (err) {
                    this.liveTranscript.innerText = "Mic access denied. Please allow microphone in browser settings.";
                    return;
                }

                const u = new SpeechSynthesisUtterance("");
                window.speechSynthesis.speak(u);

                setTimeout(() => {
                    this.startListening();
                    this.liveTranscript.innerText = "Listening... Say 'Jarvis'";
                }, 500);
            }

            startListening() {
                if (!this.recognition) return;
                this.recognition.start();
                
                clearInterval(this.micWatchdog);
                this.micWatchdog = setInterval(() => {
                    if (!this.isListening && !this.isSpeaking && !this.isProcessing) {
                        try { this.recognition.start(); } catch(e) {}
                    }
                }, 2000);
            }

            addMessage(role, text) {
                this.messages.push({ role, content: text });
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${role === 'user' ? 'user-msg' : 'ai-msg'}`;
                const avatar = document.createElement('div');
                avatar.className = 'msg-avatar';
                avatar.innerText = role === 'user' ? 'USR' : 'J';
                const content = document.createElement('div');
                content.className = 'msg-content';
                
                if (role === 'ai') {
                    content.innerHTML = marked.parse(text);
                    content.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));
                } else {
                    content.innerText = text;
                }

                msgDiv.appendChild(avatar);
                msgDiv.appendChild(content);
                this.chatContainer.appendChild(msgDiv);
                this.chatContainer.scrollTop = this.chatContainer.scrollHeight;
            }

            async sendMessage(textOverride = null) {
                const text = textOverride || this.chatInput.value.trim();
                if (!text || this.isProcessing) return;

                this.chatInput.value = '';
                this.chatInput.style.height = 'auto';
                this.addMessage('user', text);
                this.typingIndicator.classList.add('active');
                this.isProcessing = true;
                this.liveTranscript.innerText = "Processing...";
                
                if (this.isListening) this.recognition.stop();

                const systemPrompt = `You are J.A.R.V.I.S., Tony Stark's AI. Be highly intelligent, witty, formal. Address the user as 'sir'. Keep responses very brief (1-2 sentences max). Reply in this language: ${this.currentLang}.`;
                const fullPrompt = `${systemPrompt}\nUser: ${text}\nJ.A.R.V.I.S:`;

                let aiReply = null;

                // =========================================================
                // ULTRA-ROBUST API FALLBACK SYSTEM (FIXES NETWORK ISOLATION)
                // =========================================================

                // TIER 1: Direct GET (Fastest)
                try {
                    const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}`);
                    if (res.ok) aiReply = await res.text();
                } catch (e) { console.warn("Tier 1 failed."); }

                // TIER 2: CORS Proxy (Bypasses strict browser security / file:// blocks)
                if (!aiReply || aiReply.length < 2) {
                    try {
                        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent('https://text.pollinations.ai/' + encodeURIComponent(fullPrompt))}`;
                        const res = await fetch(proxyUrl);
                        if (res.ok) aiReply = await res.text();
                    } catch (e) { console.warn("Tier 2 (Proxy) failed."); }
                }

                // TIER 3: Alternative Free API (Api.Airforce)
                if (!aiReply || aiReply.length < 2) {
                    try {
                        const res = await fetch("https://api.airforce/v1/chat/completions", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                model: "gpt-3.5-turbo",
                                messages: [{ role: "system", content: systemPrompt }, { role: "user", content: text }],
                                max_tokens: 100
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            aiReply = data.choices[0].message.content;
                        }
                    } catch (e) { console.warn("Tier 3 (Airforce) failed."); }
                }

                // TIER 4: Alternative Free API (KeylessAI)
                if (!aiReply || aiReply.length < 2) {
                    try {
                        const res = await fetch("https://keylessai.thryx.workers.dev/v1/chat/completions", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                model: "gpt-3.5-turbo",
                                messages: [{ role: "system", content: systemPrompt }, { role: "user", content: text }],
                                max_tokens: 100
                            })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            aiReply = data.choices[0].message.content;
                        }
                    } catch (e) { console.warn("Tier 4 (Keyless) failed."); }
                }

                // FINAL FALLBACK
                if (!aiReply || aiReply.length < 2) {
                    aiReply = "All external networks are blocked, sir. Please ensure you are running this via a local server (like VS Code Live Server) and check your internet.";
                }

                aiReply = aiReply.replace(/J\.A\.R\.V\.I\.S\.?\s*/gi, "").replace(/Assistant:\s*/gi, "").trim();

                this.typingIndicator.classList.remove('active');
                this.addMessage('ai', aiReply);
                this.isProcessing = false;

                this.speak(aiReply);
            }

            speak(text) {
                if (!text) {
                    this.startListening();
                    return;
                }
                
                let cleanText = text.replace(/```[\s\S]*?```/g, ' [Code] ').replace(/`([^`]+)`/g, '$1').replace(/[*_#>-]/g, '').trim();
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = this.currentLang;
                
                let jarvisVoice = this.voices.find(v => v.lang === 'en-GB' && v.name.includes('Male')) || 
                                  this.voices.find(v => v.name === 'Google UK English Male') || 
                                  this.voices.find(v => v.lang === 'en-GB');
                                  
                if (jarvisVoice) utterance.voice = jarvisVoice;
                else utterance.voice = this.voices.find(v => v.lang === this.currentLang) || this.voices[0];
                
                utterance.rate = 1.05; 
                utterance.pitch = 0.85; 

                utterance.onstart = () => { 
                    this.isSpeaking = true;
                    this.mainHud.classList.remove('listening');
                    this.mainHud.classList.add('speaking'); 
                    this.liveTranscript.innerText = "J.A.R.V.I.S is speaking...";
                    if (this.isListening) this.recognition.stop();
                };
                
                utterance.onend = () => { 
                    this.isSpeaking = false;
                    this.mainHud.classList.remove('speaking'); 
                    this.liveTranscript.innerText = "Listening... Say 'Jarvis'";
                    this.startListening();
                };
                
                window.speechSynthesis.speak(utterance);
            }

            setupSpeechRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    this.liveTranscript.innerText = "Speech Recognition not supported. Use Chrome or Edge.";
                    return;
                }

                this.recognition = new SpeechRecognition();
                this.recognition.continuous = true;
                this.recognition.interimResults = true; 
                this.recognition.lang = this.currentLang;

                this.recognition.onstart = () => {
                    this.isListening = true;
                    this.mainHud.classList.add('listening');
                };

                this.recognition.onresult = (event) => {
                    if (this.isSpeaking || this.isProcessing) return;

                    let interimText = '';
                    let finalText = '';

                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalText += event.results[i][0].transcript;
                        } else {
                            interimText += event.results[i][0].transcript;
                        }
                    }

                    this.liveTranscript.innerText = `"${(finalText || interimText).trim()}"`;

                    if (finalText.length > 0) {
                        const text = finalText.toLowerCase().trim();
                        
                        // EXPANDED WAKE WORDS FOR ACCENTS
                        const wakeWords = ['jarvis', 'jervis', 'varvis', 'javis', 'jarbis', 'harvest', 'job is', 'जार्विस'];
                        const hasWakeWord = wakeWords.some(word => text.includes(word));

                        if (hasWakeWord) {
                            let command = text;
                            wakeWords.forEach(word => {
                                command = command.replace(word, '');
                            });
                            command = command.replace(/,/g, '').trim();

                            if (command.length > 2) {
                                this.sendMessage(command);
                            } else {
                                this.speak("Yes, sir?");
                            }
                        }
                    }
                };

                this.recognition.onerror = (event) => {
                    console.warn("Mic error:", event.error);
                    if (event.error === 'not-allowed') {
                        this.liveTranscript.innerText = "Microphone access denied. Please allow mic.";
                    }
                };

                this.recognition.onend = () => {
                    this.isListening = false;
                    this.mainHud.classList.remove('listening');
                    // Watchdog will auto-restart
                };
            }

            setupEventListeners() {
                this.sendBtn.addEventListener('click', () => this.sendMessage());
                this.chatInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });

                this.langSelect.addEventListener('change', (e) => {
                    this.currentLang = e.target.value;
                    if (this.recognition) {
                        this.recognition.stop();
                        setTimeout(() => {
                            this.recognition.lang = this.currentLang;
                            this.startListening();
                        }, 500);
                    }
                });
            }

            loadVoices() {
                const populateVoices = () => {
                    this.voices = window.speechSynthesis.getVoices();
                    if (this.voices.length === 0) return;

                    const nativeNames = {
                        'en': 'English', 'es': 'Español', 'fr': 'Français', 'de': 'Deutsch',
                        'it': 'Italiano', 'pt': 'Português', 'ru': 'Русский', 'ja': '日本語',
                        'ko': '한국어', 'zh': '中文', 'hi': 'हिन्दी', 'ar': 'العربية'
                    };

                    const uniqueLangs = new Set();
                    this.langSelect.innerHTML = '';

                    this.voices.forEach(voice => {
                        if (uniqueLangs.has(voice.lang)) return;
                        uniqueLangs.add(voice.lang);

                        let baseLang = voice.lang.split('-')[0].toLowerCase();
                        let nativeName = nativeNames[baseLang] || voice.lang;
                        
                        const option = document.createElement('option');
                        option.value = voice.lang;
                        option.innerText = `${nativeName} (${voice.lang})`;
                        this.langSelect.appendChild(option);
                    });

                    this.langSelect.value = this.voices.find(v => v.lang === 'en-GB') ? 'en-GB' : 'en-US';
                    this.currentLang = this.langSelect.value;
                };

                populateVoices();
                window.speechSynthesis.onvoiceschanged = populateVoices;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.jarvisObj = new JarvisGPT();
        });
    </script>
</body>
</html>
